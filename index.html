<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War of 1812: A Second War for Independence?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Alfa+Slab+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4EDF2; --surface:#FFFFFF; --surface2:#F1F5F8; --ink:#13233F; --muted:#4B5B73;
  --navy:#1B3358; --red:#B8202F; --gold:#E8A317; --sea:#1E6A93;
  --good:#1F7244; --goodbg:#E3F3E9; --bad:#A3261F; --badbg:#FBE7E5; --hintbg:#FFF3D1;
  --line:#C6D4DE; --onnavy:#FFFFFF; --quote:#F7F2E6;
  --btn:#B8202F; --seafill:#CFE3EC; --route:#1B3358; --wave:#9CC3D5; --trail:#B8202F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1626; --surface:#15233A; --surface2:#1C2D48; --ink:#E8EEF6; --muted:#A8B6CA;
    --navy:#203A63; --red:#F0717F; --gold:#F0B43A; --sea:#7CBCE3;
    --good:#74D29B; --goodbg:#163826; --bad:#F59A90; --badbg:#3F1D1D; --hintbg:#3A3116;
    --line:#2D4266; --onnavy:#FFFFFF; --quote:#1F2C40;
    --btn:#C42A3B; --seafill:#132F48; --route:#9CC1EA; --wave:#2A5576; --trail:#F0B43A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1626; --surface:#15233A; --surface2:#1C2D48; --ink:#E8EEF6; --muted:#A8B6CA;
  --navy:#203A63; --red:#F0717F; --gold:#F0B43A; --sea:#7CBCE3;
  --good:#74D29B; --goodbg:#163826; --bad:#F59A90; --badbg:#3F1D1D; --hintbg:#3A3116;
  --line:#2D4266; --onnavy:#FFFFFF; --quote:#1F2C40;
  --btn:#C42A3B; --seafill:#132F48; --route:#9CC1EA; --wave:#2A5576; --trail:#F0B43A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",Arial,sans-serif;font-size:1.15rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;font-weight:400;line-height:1.2;margin:0}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--onnavy);padding:.6rem 1rem .7rem}
.hrow{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;justify-content:space-between}
.brand{font-family:"Alfa Slab One",Georgia,serif;font-size:1.15rem;letter-spacing:.01em}
.flags{display:flex;gap:.35rem;align-items:center}
.flag{width:2.1rem;height:1.55rem;border-radius:3px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0;position:relative}
.flag.done{border-color:#fff}
.flag.cur{outline:3px solid var(--gold);outline-offset:2px}
.flag .em{background:#fff;border-radius:50%;width:1.15rem;height:1.15rem;display:grid;place-items:center;font-size:.72rem;line-height:1}
.flag .lock{font-size:.75rem;opacity:.75}
.flag[disabled]{cursor:default}
.meter{flex-basis:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;max-width:960px;margin:.55rem auto 0}
.meter span{display:block;height:100%;background:var(--gold);transition:width .5s}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}
.tbtn{background:transparent;border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:99px;padding:.25rem .8rem;font-size:.95rem}
.tbtn[aria-pressed="true"]{background:#fff;color:#1B3358;border-color:#fff;font-weight:700}
.tbtn.warn{background:#B8202F;border-color:#B8202F}

/* Main */
main{max-width:760px;margin:0 auto;padding:1.4rem 1rem 4rem;outline:none}
.kicker{color:var(--muted);font-weight:700;font-size:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:baseline}
.kicker .date{color:var(--sea)}
h2.title{font-size:clamp(1.7rem,4vw,2.4rem);margin:.2rem 0 1rem;color:var(--ink)}
.steps{display:flex;gap:.4rem;margin:0 0 1.2rem;padding:0;list-style:none;flex-wrap:wrap}
.steps li{font-size:.92rem;padding:.2rem .75rem;border-radius:99px;border:2px solid var(--line);color:var(--muted)}
.steps li.on{border-color:var(--sea);color:var(--ink);font-weight:700}
.steps li.ok{border-color:var(--good);color:var(--good)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;margin:0 0 1rem}
.panel p{margin:0 0 .9rem;max-width:68ch}
.panel p:last-child{margin-bottom:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.7rem}
.phead h3{font-size:1.15rem;color:var(--sea)}
.say{background:var(--surface2);border:2px solid var(--line);border-radius:99px;padding:.2rem .75rem;font-size:.92rem;white-space:nowrap}
.say.on{background:var(--sea);border-color:var(--sea);color:#fff}
.term{background:none;border:0;padding:0;color:var(--sea);font-weight:700;text-decoration:underline dotted 2px;text-underline-offset:3px}
.ws{border:2px dashed var(--muted);border-radius:12px;padding:.8rem 1rem;margin:0 0 1rem;display:flex;gap:.75rem;align-items:flex-start;background:var(--surface)}
.ws .pencil{font-size:1.5rem;line-height:1}
.ws strong{display:block}
.other{border-left:6px solid var(--red);background:var(--surface2);border-radius:0 12px 12px 0;padding:.9rem 1.1rem;margin:0 0 1rem}
.other h3{font-size:1.05rem;color:var(--red);margin-bottom:.35rem}
.other p{margin:0}
blockquote{margin:0 0 .9rem;padding:1rem 1.2rem;background:var(--quote);border-radius:10px;font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;line-height:1.7;font-style:italic}
.cite{font-size:1rem;color:var(--muted);margin:0 0 .8rem}
.plain{border-top:2px solid var(--line);padding-top:.7rem}
.plain b{color:var(--sea)}
.qtext{font-weight:700;margin:0 0 .8rem;max-width:68ch}
.inst{color:var(--muted);font-size:1rem;margin:-.4rem 0 .8rem}
.opts{display:grid;gap:.55rem;margin:0 0 1rem}
.opt{text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:.65rem .9rem;display:flex;gap:.7rem;align-items:flex-start}
.opt .dot{flex:none;width:1.2rem;height:1.2rem;border-radius:50%;border:2px solid var(--muted);margin-top:.25rem}
.opt[aria-checked="true"]{border-color:var(--sea);background:var(--surface)}
.opt[aria-checked="true"] .dot{background:var(--sea);border-color:var(--sea);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.wrong{opacity:.55;text-decoration:line-through}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.olist{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.5rem}
.olist li{display:flex;align-items:center;gap:.6rem;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem}
.olist .n{font-family:"Alfa Slab One",Georgia,serif;color:var(--sea);width:1.4rem;text-align:center}
.olist .txt{flex:1}
.olist .arr{display:flex;gap:.3rem}
.olist .arr button{width:2.4rem;height:2.4rem;border-radius:8px;border:2px solid var(--line);background:var(--surface)}
.olist .arr button:disabled{opacity:.35;cursor:default}
.olist li.good{border-color:var(--good)}
.olist li.badrow{border-color:var(--bad)}
.mrow{display:grid;grid-template-columns:minmax(8rem,1fr) 2fr;gap:.6rem;align-items:center;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:.55rem .75rem;margin-bottom:.5rem}
.mrow b{font-weight:700}
.mrow select{font:inherit;font-size:1rem;padding:.4rem;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.mrow.good{border-color:var(--good)}
.mrow.badrow{border-color:var(--bad)}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.fb{border-radius:10px;padding:.8rem 1rem;margin:0 0 1rem}
.fb p{margin:0 0 .4rem}
.fb p:last-child{margin:0}
.fb.good{background:var(--goodbg);border:2px solid var(--good)}
.fb.hint{background:var(--hintbg);border:2px solid var(--gold)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb .h{font-weight:700}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.btn{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:.7rem 1.3rem;font-weight:700;font-size:1.05rem}
.btn.alt{background:var(--surface2);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* Hero / intro */
.hero{padding:1rem 0 .5rem}
.hero .bigq{font-size:clamp(2rem,6vw,3.3rem);line-height:1.1;margin:.4rem 0 1rem;color:var(--ink)}
.hero .years{font-family:"Alfa Slab One",Georgia,serif;color:var(--red);font-size:1.2rem}
.lede{font-size:1.25rem;max-width:60ch;margin:0 0 1.2rem}
.howto{display:grid;gap:.6rem;margin:0 0 1.4rem;padding:0;list-style:none}
.howto li{display:flex;gap:.8rem;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.howto .ic{font-size:1.4rem;line-height:1.2}
.flagstrip{display:flex;gap:.35rem;margin:.4rem 0 0}
.flagstrip i{width:2.4rem;height:1.7rem;border-radius:3px;display:block;border:2px solid var(--line)}

/* Badge moment */
.badge{display:flex;gap:1.1rem;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:1.1rem 1.2rem;margin:0 0 1rem}
.bigflag{flex:none;width:5.2rem;height:3.8rem;border-radius:5px;border:3px solid #fff;display:grid;place-items:center}
.bigflag .em{background:#fff;border-radius:50%;width:2.4rem;height:2.4rem;display:grid;place-items:center;font-size:1.4rem}
.badge h3{font-size:1.4rem}
.badge p{margin:.2rem 0 0;opacity:.9}
@media (prefers-reduced-motion:no-preference){.badge .bigflag{animation:hoist .7s cubic-bezier(.2,.8,.3,1.2)}}
@keyframes hoist{from{transform:translateY(30px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.evi{border-left:6px solid var(--gold);background:var(--surface);border-radius:0 12px 12px 0;padding:.8rem 1rem;margin:0 0 1rem}
.evi b{display:block;color:var(--muted);font-size:.95rem}

/* Finale */
.bank{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.5rem}
.bank li{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:.6rem .9rem;display:flex;gap:.7rem}
.bank .fl{flex:none;width:2rem;height:1.45rem;border-radius:3px;margin-top:.25rem}
.bank small{display:block;color:var(--muted);font-weight:700}
.claims{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}
.claims button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:.45rem 1.1rem;font-weight:700}
.claims button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.frame{background:var(--surface2);border:2px solid var(--sea);border-radius:12px;padding:1rem 1.1rem;margin:0 0 1rem}
.frame p{margin:0 0 .5rem}
.blank{display:inline-block;min-width:6rem;border-bottom:2px solid var(--muted);height:1.1em;vertical-align:baseline}
.trophy{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 0}
.trophy .flag{width:2.6rem;height:1.9rem}

/* Stats + voyage map */
.stats{display:flex;gap:1rem;font-weight:700;font-size:1.05rem;align-items:baseline}
.stats b{font-size:1.25rem}
.panel{display:flow-root}
.say.corner{float:right;margin:0 0 .4rem .9rem}
.voyage{position:relative;aspect-ratio:1000/175;margin:2.6rem 0 1.6rem;border-radius:14px;background:var(--seafill)}
.voyage svg.sea{position:absolute;inset:0;width:100%;height:100%;border-radius:14px}
.port{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;z-index:1}
.port .pin{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--surface);border:3px solid var(--route);color:var(--ink);font-weight:700;font-size:.95rem;line-height:1}
.port.start .pin,.port.end .pin{border-style:dashed;font-size:1rem}
.port.done .pin{width:2.4rem;height:1.75rem;border-radius:4px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.port.cur .pin{outline:3px solid var(--gold);outline-offset:3px}
.port.locked .pin{opacity:.6;font-size:.75rem}
.port[disabled]{cursor:default}
.plab{position:absolute;left:50%;top:calc(100% + .3rem);transform:translateX(-50%);font-size:.72rem;font-weight:700;white-space:nowrap;color:var(--ink);background:var(--seafill);padding:0 .3rem;border-radius:4px}
.port.cur .plab{color:var(--red)}
@media (max-width:700px){.plab{display:none}}
.ship{position:absolute;width:3.4rem;transform:translate(-50%,-108%);pointer-events:none;z-index:2}
.ship svg{display:block;width:100%;height:auto;overflow:visible}
.ship.left svg{transform:scaleX(-1)}
.ship .bob{transform-box:fill-box;transform-origin:50% 90%}
@media (prefers-reduced-motion:no-preference){.ship .bob{animation:bob 2.6s ease-in-out infinite}.ship.sailing .bob{animation-duration:.8s}}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}

/* Battle arena */
:root{--sky:#BFE0F0;--water:#2F7FA8;--ground:#A08C5B;--roadc:#7A6340}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--sky:#1E3A5C;--water:#163E5C;--ground:#4F4530;--roadc:#5A4A30}}
:root[data-theme='dark']{--sky:#1E3A5C;--water:#163E5C;--ground:#4F4530;--roadc:#5A4A30}
.arena{scroll-margin-top:72px;position:relative;height:clamp(230px,32vw,290px);border-radius:14px;overflow:hidden;margin:0 0 .8rem;border:2px solid var(--line);background:linear-gradient(var(--sky) 0 58%,var(--water) 58%)}
.arena.shore{background:linear-gradient(var(--sky) 0 58%,transparent 58%),linear-gradient(90deg,var(--ground) 0 46%,var(--water) 46%)}
.arena.land{background:linear-gradient(var(--sky) 0 58%,var(--ground) 58%)}
.arena.hall{background:radial-gradient(circle at 50% 120%,var(--surface) 0 40%,var(--surface2) 70%)}
.stage{position:absolute;inset:0}
.actor{position:absolute;bottom:5%;width:36%;max-width:230px}
.actor.l{left:3%}.actor.r{right:3%}
.actor .art{display:block;width:100%;height:auto;overflow:visible}
.actor.r.flipme .art{transform:scaleX(-1)}
.bobber,.march{transform-box:fill-box;transform-origin:50% 90%}
@media (prefers-reduced-motion:no-preference){.actor .bobber{animation:bob 3s ease-in-out infinite}.actor.r .bobber{animation-delay:-1.4s}.actor .march{animation:march 1.2s ease-in-out infinite}}
@keyframes march{50%{transform:translateX(-3px) translateY(-1px)}}
.actor.defeated{animation:retreat 1.6s ease-out forwards}
@keyframes retreat{to{transform:translate(16%,8%) rotate(7deg);opacity:.55}}
.actor.defeated::before{content:'🏳️';position:absolute;left:50%;top:-18%;font-size:2rem;transform:translateX(-50%)}
.hp{position:absolute;top:10px;width:44%;z-index:3}
.hp.l{left:3%}.hp.r{right:3%;text-align:right}
.hp .nm{display:inline-block;font-weight:700;font-size:.88rem;color:#13233F;background:rgba(255,255,255,.92);border-radius:6px;padding:.05rem .45rem}
.hp .bar{height:13px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:.3rem;border:2px solid #fff}
.hp .bar span{display:block;height:100%;background:#2FB35A;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.hp.r .bar span{background:#E0433A;margin-left:auto}
.proj{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#1b1b1b;box-shadow:0 0 0 2px rgba(255,255,255,.6);z-index:5;pointer-events:none}
.proj.rocket{left:-14px;top:-4px;width:28px;height:8px;border-radius:4px;background:linear-gradient(90deg,#F2C200,#E0433A);box-shadow:0 0 10px #F2C200}
.boom{position:absolute;font-size:3rem;line-height:1;z-index:6;pointer-events:none}
.puff{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(245,245,245,.85);pointer-events:none;z-index:4}
.floaty{position:absolute;font-family:'Alfa Slab One',Georgia,serif;font-size:1.35rem;white-space:nowrap;z-index:7;pointer-events:none;color:#fff;text-shadow:0 2px 0 #13233F,0 0 6px rgba(0,0,0,.45)}
.floaty.gold{color:#FFD84A}.floaty.red{color:#FF9A90}
.banner{position:absolute;z-index:8;background:#1B3358;color:#fff;font-family:'Alfa Slab One',Georgia,serif;font-size:1.5rem;padding:.4rem 1.2rem;border-radius:12px;border:3px solid #F2C200;white-space:nowrap;pointer-events:none}
.token{position:absolute;left:-.8rem;top:-.8rem;font-size:1.6rem;line-height:1;z-index:6;pointer-events:none}
.conf{position:absolute;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:30}
.bstat{display:flex;gap:1.4rem;flex-wrap:wrap;font-weight:700;margin:0 0 .5rem;color:var(--muted)}
.bstat b{color:var(--ink)}
.mission{margin:0 0 1rem;font-weight:700}
.hallbox{position:absolute;inset:14% 7% auto;display:grid;gap:.8rem}
.vrow{display:grid;grid-template-columns:3.5rem 1fr 3rem;gap:.6rem;align-items:center;font-weight:700}
.vbar{height:28px;border-radius:8px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.vbar span{display:block;height:100%;background:#2F7F4F;transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.vbar span.nay{background:#9A3B33}
.vn{font-family:'Alfa Slab One',Georgia,serif;font-size:1.4rem}
.vgoal{color:var(--muted);font-weight:700;text-align:center}
.council{position:absolute;inset:0}
.fire{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.6rem;text-align:center;line-height:1}
.fire small{display:block;font-size:.8rem;font-weight:700;color:var(--ink);margin-top:.25rem}
.tok{position:absolute;transform:translate(-50%,-50%) scale(.85);padding:.35rem .85rem;border-radius:99px;border:2px dashed var(--muted);color:var(--muted);font-weight:700;background:var(--surface);transition:all .5s cubic-bezier(.3,1.5,.5,1);opacity:.6;white-space:nowrap}
.tok.on{border:2px solid var(--sea);background:var(--sea);color:#fff;opacity:1;transform:translate(-50%,-50%) scale(1.05)}
.t0{left:50%;top:15%}.t1{left:80%;top:50%}.t2{left:50%;top:85%}.t3{left:20%;top:50%}
.road{position:absolute;left:0;right:0;bottom:14%;height:13%;background:var(--roadc)}
.cap{position:absolute;left:2%;bottom:25%;font-size:3.2rem;line-height:1}
.cap .flames{position:absolute;left:35%;top:-35%;font-size:2rem}
@media (prefers-reduced-motion:no-preference){.flames,.chase{animation:flick .5s infinite alternate}}
@keyframes flick{to{transform:translateX(-50%) scale(1.15) translateY(-3px)}}
.cap .flames{animation-name:flick2}
@keyframes flick2{to{transform:scale(1.15) translateY(-3px)}}
.wagon{position:absolute;bottom:20%;width:20%;max-width:120px;transform:translateX(-50%);transition:left .9s cubic-bezier(.3,1.2,.5,1)}
.wagon svg{width:100%;height:auto;display:block}
.chase{position:absolute;bottom:24%;font-size:2.4rem;line-height:1;transform:translateX(-50%);transition:left .8s}
.safe{position:absolute;right:2%;bottom:24%;font-size:2.8rem;text-align:center;line-height:1}
.safe small{display:block;font-size:.8rem;font-weight:700;color:var(--ink)}
.tbox{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;padding:0 6%}
.tline{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;font-weight:700}
.ttrack{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#9A3B33,#E8C77A,#2F7F4F)}
.ttrack span{position:absolute;top:50%;transform:translate(-50%,-60%);font-size:2.2rem;transition:left .8s cubic-bezier(.3,1.3,.5,1)}
.tcap{text-align:center;color:var(--muted);font-weight:700}

/* Mini-games */
.port.game .pin{width:1.6rem;height:1.6rem;font-size:.8rem;border-width:2px;background:var(--hintbg)}
.port.game.gdone .pin{background:var(--gold);color:#13233F}
.ghud{scroll-margin-top:66px;display:flex;gap:1.4rem;flex-wrap:wrap;font-weight:700;margin:.2rem 0 .6rem;color:var(--muted);min-height:1.6rem}
.ghud b{color:var(--ink);font-size:1.15rem}
.gbox{position:relative;height:clamp(320px,44vw,400px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(var(--sky),var(--surface2));touch-action:manipulation;user-select:none;-webkit-user-select:none}
.gbox.catch,.gbox.catch *{cursor:crosshair}
.gbox.night{background:linear-gradient(#0E1B33,#2B4A78)}
.gover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,20,40,.45);z-index:20}
.gover .btn{font-size:1.3rem;padding:.9rem 2rem}
.tgt{position:absolute;left:0;top:0;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;will-change:transform;z-index:2}
.tgt svg{width:84px;height:auto;display:block}
.tgt.flipx svg{transform:scaleX(-1)}
.tag{margin-top:-2px;background:#FFF8E6;color:#13233F;border:2px solid #7A5A12;border-radius:6px;padding:.1rem .5rem;font-weight:700;font-size:.92rem;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tgt.hit>*{animation:popout .35s forwards}
@keyframes popout{to{transform:scale(1.5);opacity:0}}
.wing{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){.wing{animation:flap .3s ease-in-out infinite alternate}}
@keyframes flap{to{transform:scaleY(-.5)}}
.prompt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#13233F;border:3px solid #F2C200;border-radius:12px;padding:.3rem 1rem;font-weight:700;z-index:5;text-align:center;width:max-content;max-width:90%;line-height:1.3}
.prompt small{color:#4B5B73;font-weight:700}
.rk{position:absolute;left:0;top:0;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;z-index:3;cursor:crosshair}
.rk .trail{width:10px;height:34px;border-radius:5px;background:linear-gradient(transparent,#F2C200,#E0433A)}
.rk .yr{font-family:'Alfa Slab One',Georgia,serif;font-size:1.2rem;color:#13233F;background:#E9EEF3;border:3px solid #fff;border-radius:10px 10px 18px 18px;padding:.15rem .6rem .35rem;box-shadow:0 0 12px rgba(242,194,0,.7)}
.rk.dud{opacity:.35;pointer-events:none;filter:grayscale(1)}
.gfort{position:absolute;left:33%;bottom:-4px;width:34%}
.dhead{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.dhead button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:.4rem;font-weight:700;font-size:.95rem}
.dboard{position:relative;height:clamp(320px,42vw,380px);border-radius:12px;border:2px solid var(--line);overflow:hidden;background:linear-gradient(90deg,transparent 33.1%,var(--line) 33.1% 33.4%,transparent 33.4% 66.5%,var(--line) 66.5% 66.8%,transparent 66.8%),var(--surface2);touch-action:manipulation;user-select:none}
.blk{position:absolute;width:calc(33.333% - 8px);margin-left:4px;display:grid;place-items:center;align-content:center;text-align:center;font-weight:700;font-size:.95rem;line-height:1.15;color:#fff;background:#1E6A93;border-radius:8px;border:3px solid rgba(255,255,255,.7);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);transition:top .12s linear,left .12s ease-out;padding:.2rem;z-index:2}
.blk.wrong{background:#8A3A33}
.blk.good{animation:popout .25s forwards}
.blk small{font-size:.72rem;opacity:.95}
.colflash{position:absolute;top:0;bottom:0;width:33.333%;background:rgba(47,179,90,.35);pointer-events:none;animation:fadeout .5s forwards}
@keyframes fadeout{to{opacity:0}}
.dctl{display:flex;gap:.6rem;justify-content:center;margin-top:.6rem}
.dctl button{font-size:1.4rem;width:4.4rem;height:3rem;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.mgrid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.card{perspective:800px;height:104px;background:none;border:0;padding:0}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:.4rem;text-align:center;font-weight:700}
.card .b{background:repeating-linear-gradient(45deg,#1B3358 0 10px,#203E6A 10px 20px);color:#F2C200;font-size:2rem;border:3px solid #F2C200}
.card .f{transform:rotateY(180deg);background:var(--surface);border:3px solid var(--sea);color:var(--ink);font-size:.9rem;line-height:1.2}
.card .f.person{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:1rem;background:var(--hintbg)}
.card.matched .f{border-color:var(--good);background:var(--goodbg)}
.gscore{font-family:'Alfa Slab One',Georgia,serif;font-size:2rem;margin:.2rem 0 .6rem}
.gscore small{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:.9rem;color:var(--muted)}
.rev{margin:0 0 .8rem;padding-left:1.2rem}
.rev li{margin:.15rem 0}

/* Glossary sheet */
#gloss{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 2rem));background:var(--surface);border:3px solid var(--sea);border-radius:14px;padding:1rem 1.1rem;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;display:none}
#gloss.show{display:block}
#gloss h3{font-size:1.2rem;color:var(--sea);margin-bottom:.3rem}
#gloss p{margin:0 0 .7rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== 8-bit retro theme ===== */
:root{--bg:#D8D8D8;--surface:#FCFCFC;--surface2:#ECECEC;--ink:#000000;--muted:#3C3C3C;--navy:#0000A8;--red:#D82800;--gold:#F8B800;--sea:#0058F8;--good:#00A800;--goodbg:#D8F8D8;--bad:#D82800;--badbg:#FCE0D8;--hintbg:#FCF0C0;--line:#000000;--quote:#FCF0C0;--btn:#D82800;--seafill:#3CBCFC;--route:#000000;--wave:#FCFCFC;--trail:#D82800;--sky:#3CBCFC;--water:#0058F8;--ground:#AC7C00;--roadc:#7C5C00;--shadow:#000000;--px:'Press Start 2P',ui-monospace,'Courier New',monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#000000;--surface:#14143C;--surface2:#20205C;--ink:#FCFCFC;--muted:#BCBCBC;--navy:#0000A8;--red:#F85838;--sea:#3CBCFC;--good:#58D854;--goodbg:#003C00;--bad:#F85838;--badbg:#3C0000;--hintbg:#3C3000;--line:#FCFCFC;--quote:#20205C;--seafill:#0058F8;--route:#FCFCFC;--wave:#3CBCFC;--trail:#F8B800;--sky:#000070;--water:#0058F8;--ground:#7C5C00;--roadc:#503000;--shadow:#3C3CBC;color-scheme:dark}}
:root[data-theme='dark']{--bg:#000000;--surface:#14143C;--surface2:#20205C;--ink:#FCFCFC;--muted:#BCBCBC;--navy:#0000A8;--red:#F85838;--sea:#3CBCFC;--good:#58D854;--goodbg:#003C00;--bad:#F85838;--badbg:#3C0000;--hintbg:#3C3000;--line:#FCFCFC;--quote:#20205C;--seafill:#0058F8;--route:#FCFCFC;--wave:#3CBCFC;--trail:#F8B800;--sky:#000070;--water:#0058F8;--ground:#7C5C00;--roadc:#503000;--shadow:#3C3CBC;color-scheme:dark}
body{background-color:var(--bg);background-image:radial-gradient(rgba(128,128,128,.18) 1px,transparent 1.2px);background-size:6px 6px}
*,*::before,*::after{border-radius:0 !important}
h1,h2,h3,.brand,.kicker,.steps li,.btn,.tbtn,.say,.vn,.floaty,.banner,.gscore,.yr,.olist .n,.hero .years,.plab,.hp .nm,.tag,.blk,.bstat,.ghud,.stats,.dhead button,.claims button,.card .f.person,.badge h3,.fb .h,.prompt,.tok,.vrow,.tcap,.vgoal,.fire small,.safe small,.ws strong,.evi b,.bank small{font-family:var(--px) !important;font-weight:400 !important;letter-spacing:0;line-height:1.6}
h1.bigq{font-size:clamp(1.15rem,3.4vw,1.9rem);line-height:1.5;text-shadow:4px 4px 0 var(--gold)}
h2.title{font-size:clamp(.95rem,2.6vw,1.4rem);line-height:1.5}
h3,.phead h3{font-size:.78rem}
.brand{font-size:.8rem;text-shadow:2px 2px 0 #000}
.kicker,.hero .years{font-size:.65rem}
.steps li{font-size:.58rem;padding:.4rem .6rem}
.stats{font-size:.7rem;gap:1.2rem}.stats b{font-size:.8rem}
.tbtn{font-size:.58rem;padding:.45rem .6rem;border:3px solid #FCFCFC}
.say{font-size:.55rem;padding:.4rem .55rem;border:3px solid var(--line)}
.btn{font-size:.78rem;padding:.85rem 1.2rem;border:3px solid #000;box-shadow:4px 4px 0 #000;text-transform:uppercase}
.btn.alt{border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.btn:active,.tbtn:active,.say:active,.dctl button:active,.dhead button:active{transform:translate(3px,3px);box-shadow:none}
.plab{font-size:.42rem;padding:.1rem .2rem}
.hp .nm{font-size:.52rem;border:2px solid #000}
.tag{font-size:.55rem;border:3px solid #000;padding:.25rem .4rem;box-shadow:3px 3px 0 #000}
.blk{font-size:.6rem;border:3px solid #000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.35)}
.yr{font-size:.85rem !important;border:3px solid #000 !important;box-shadow:3px 3px 0 #000 !important}
.floaty{font-size:.95rem;text-shadow:3px 3px 0 #000}
.banner{font-size:.95rem;border:4px solid #F8B800;box-shadow:6px 6px 0 #000;padding:.7rem 1rem}
.gscore{font-size:1.3rem}
.bstat,.ghud{font-size:.62rem}.bstat b,.ghud b{font-size:.75rem}
.claims button{font-size:.7rem;border:3px solid var(--line)}
.card .f.person{font-size:.62rem}
.badge h3{font-size:.85rem}
.fb .h{font-size:.72rem}
.prompt{font-size:.62rem;border:4px solid #F8B800;box-shadow:4px 4px 0 #000}
.prompt small{font-size:.5rem}
.tok{font-size:.52rem;border:3px solid var(--line)}
.vrow{font-size:.7rem}.vn{font-size:1rem}
.tcap,.vgoal{font-size:.55rem}
.dhead button{font-size:.55rem;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow)}
.ws strong,.evi b,.bank small{font-size:.6rem;margin-bottom:.3rem}
.panel,.ws,.howto li,.opt,.olist li,.mrow,.fb,.evi,.bank li,.frame,.badge,.other,.card .f,.card .b,.dctl button,.vbar,.hp .bar{border-width:3px !important}
.panel,.howto li,.fb,.evi,.bank li,.frame,.arena,.gbox,.dboard,.voyage,.badge,.other,.opt[aria-checked='true']{box-shadow:6px 6px 0 var(--shadow)}
.panel,.howto li,.opt,.olist li,.mrow,.bank li,.frame{border-color:var(--line) !important}
.arena,.gbox,.dboard,.voyage{border:4px solid var(--line) !important}
.dctl button{border-color:var(--line);box-shadow:3px 3px 0 var(--shadow);font-family:var(--px);font-size:1rem}
.other{border:3px solid var(--line);border-left:8px solid var(--red)}
.evi{border:3px solid var(--line);border-left:8px solid var(--gold)}
header{border-bottom:4px solid #000}
.arena::after,.gbox::after,.voyage::after,.dboard::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:25;background:repeating-linear-gradient(rgba(0,0,0,.13) 0 2px,transparent 2px 4px)}
.pix,.pxi,.fr2 img{image-rendering:crisp-edges;image-rendering:pixelated}
.pxi{display:inline-block;vertical-align:bottom}
.coin{width:1.05em;height:1.05em;vertical-align:-.15em}
.fr2{position:relative;display:inline-block;vertical-align:bottom}
.fr2 img{display:block;width:100%;height:auto}
.fr2 .f2{position:absolute;left:0;top:0;visibility:hidden}
@media (prefers-reduced-motion:no-preference){.fr2 .f1{animation:fA .36s steps(1) infinite}.fr2 .f2{animation:fB .36s steps(1) infinite}.actor{animation:bobpx 1.1s steps(2) infinite}.actor.r{animation-delay:-.55s}.ship .bob{animation:bobpx 1s steps(2) infinite !important}}
@keyframes fA{0%{visibility:visible}50%{visibility:hidden}}
@keyframes fB{0%{visibility:hidden}50%{visibility:visible}}
@keyframes bobpx{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.actor.defeated{animation:retreat 1.6s steps(8) forwards}
.gfr{display:block;width:88px}
.tgt.flipx .gfr{transform:scaleX(-1)}
.ship img{display:block;width:100%;height:auto}
.ship .bob{display:block}
.ship.left img{transform:scaleX(-1)}
.proj{width:12px;height:12px;left:-6px;top:-6px;background:#000;box-shadow:0 0 0 3px #FCFCFC}
.proj.rocket{width:30px;height:9px;left:-15px;top:-4px;background:linear-gradient(90deg,#F8B800 0 33%,#F87800 33% 66%,#D82800 66%);box-shadow:0 0 0 2px #000}
.puff{width:18px;height:18px;background:#FCFCFC;border:3px solid #BCBCBC}
.conf{width:10px;height:10px}
.boom{font-size:0}
#route{stroke-linecap:butt;stroke-dasharray:8 8}
#trail{stroke-linecap:butt}
.port .pin{border-width:3px;box-shadow:3px 3px 0 #000;font-family:var(--px);font-size:.6rem}
.card .b{background:repeating-conic-gradient(#0000A8 0 25%,#0058F8 0 50%) 0 0/16px 16px;border:3px solid #F8B800}
.opt .dot{border-width:3px}
.term{text-decoration:underline dashed 2px}
.cap{bottom:24%}
.cap .flames{left:30%;top:-55%;width:30px}
.chase{bottom:24%}
.wagon{bottom:21%}
.fire{font-size:0}
.fire .fr2{width:48px}
.fire small{font-size:.5rem;margin-top:.4rem}
.safe{font-size:0}
.safe small{font-size:.5rem;margin-top:.3rem}
@media (prefers-reduced-motion:no-preference){.cap .flames,.chase{animation:none}}
.wagon img{display:block;width:100%;height:auto}
.toast{display:none;position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;background:#0000A8;color:#FCFCFC;font-family:var(--px);font-size:.6rem;line-height:1.6;padding:.7rem .9rem;border:3px solid #FCFCFC;box-shadow:4px 4px 0 #000;max-width:calc(100% - 2rem)}
/* Shop, guide, letters, boss */
.shopbtn{background:transparent;color:#FCFCFC;border:3px solid #FCFCFC;font-family:var(--px);font-size:.7rem;padding:.35rem .55rem;cursor:pointer}
.shopbtn b{font-size:.8rem}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(0,0,0,.65);padding:1rem}
.mbox{background:var(--surface);color:var(--ink);border:4px solid var(--line);box-shadow:8px 8px 0 #000;max-width:600px;width:100%;max-height:calc(100vh - 2rem);overflow:auto;padding:1.2rem}
.mhead{display:flex;gap:1rem;align-items:center;margin-bottom:.8rem}
.mhead p{margin:.4rem 0 0;font-style:italic}
.purse{font-family:var(--px);font-size:.72rem;margin:0 0 .8rem}
.item{display:grid;grid-template-columns:3rem 1fr auto;gap:.8rem;align-items:center;border:3px solid var(--line);padding:.7rem;margin-bottom:.6rem;background:var(--surface2)}
.item .ic{font-size:2rem;text-align:center;line-height:1}
.item b{display:block;font-family:var(--px);font-weight:400;font-size:.62rem;line-height:1.6}
.item small{display:block;color:var(--muted);font-size:.92rem;line-height:1.35;margin-top:.2rem}
.item .btn{font-size:.62rem;padding:.6rem .7rem;white-space:nowrap}
.sw{display:inline-block;width:2rem;height:1.5rem;border:3px solid #000;vertical-align:middle}
.hintbtn{background:var(--hintbg);color:var(--ink);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);font-family:var(--px);font-size:.6rem;padding:.75rem .8rem;cursor:pointer}
.hintbtn:active{transform:translate(3px,3px);box-shadow:none}
.guide{display:flex;gap:.9rem;align-items:flex-end;margin:0 0 1rem}
.guide img{width:60px;flex:none}
.bubble{position:relative;flex:1;background:var(--surface);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:.75rem .9rem;display:flow-root}
.bubble::before{content:'';position:absolute;left:-15px;bottom:14px;border:6px solid transparent;border-right:9px solid var(--line)}
.bubble b{display:block;font-family:var(--px);font-weight:400;font-size:.6rem;color:var(--sea);margin-bottom:.35rem}
.letter{background:#FCF0C0;color:#3C2800;border:3px solid #7C5C00;box-shadow:6px 6px 0 var(--shadow);padding:1rem 1.2rem;margin:0 0 1rem;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.65;display:flow-root}
.letter h3{font-family:var(--px);font-size:.62rem;color:#7C5C00;margin:0 0 .6rem}
.letter p{margin:0 0 .5rem}
.letter .say{background:#FCFCFC;color:#000;border-color:#7C5C00}
.satchel summary{cursor:pointer;font-family:var(--px);font-size:.65rem;line-height:1.6}
.satchel[open] summary{margin-bottom:1rem}
.actor.r.bossy{width:46%;max-width:300px}
.actions .btn.alt{margin-right:.2rem}
/* Captain, cosmetics, hard mode */
.cpick{display:flex;gap:.7rem;flex-wrap:wrap;margin:.3rem 0 1rem}
.cbtn{background:var(--surface2);border:3px solid var(--line);padding:.45rem;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.cbtn[aria-pressed='true']{background:var(--hintbg);outline:4px solid var(--gold);outline-offset:2px}
.cbtn img{width:52px;display:block}
.cfield{display:grid;gap:.35rem;margin:0 0 .8rem}
.cfield span{font-family:var(--px);font-size:.58rem;line-height:1.6}
.cfield input{font:inherit;font-size:1.05rem;padding:.55rem .7rem;border:3px solid var(--line);background:var(--surface);color:var(--ink);max-width:22rem;width:100%}
.cchip{display:inline-flex;gap:.45rem;align-items:center;font-size:.6rem}
.cchip img{width:22px}
@media (max-width:820px){.cchip span{display:none}}
.shead{font-family:var(--px);font-size:.58rem;margin:1.1rem 0 .5rem;color:var(--muted)}
.actor .pet{position:absolute;left:13%;top:44%;width:17%}
.proj.gold{background:#F8B800;box-shadow:0 0 0 3px #FCFCFC,0 0 14px #F8D878}
.tbar{height:16px;border:3px solid var(--line);background:var(--surface2);margin:0 0 1rem}
.tbar span{display:block;height:100%;width:100%;background:#00A800;transition:width .1s linear}
.tbar.low span{background:#D82800}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
@media (max-width:620px){.hopts{grid-template-columns:1fr}}
.hopts .opt{display:block;text-align:left;cursor:pointer}
.hardcta{border:4px solid #F8B800;background:#0000A8;color:#FCFCFC;padding:1rem 1.1rem;margin:0 0 1rem;box-shadow:6px 6px 0 #000}
.hardcta p{margin:0 0 .8rem;font-family:var(--px);font-size:.62rem;line-height:1.6}
/* Completion code + teacher checker */
.codebox{border:4px solid #F8B800;background:var(--surface);box-shadow:6px 6px 0 var(--shadow);padding:1rem 1.2rem;margin:0 0 1rem}
.codebox .clabel{font-family:var(--px);font-size:.62rem;line-height:1.6;margin:0 0 .6rem}
.codebox p{margin:0 0 .7rem}
.code{font-family:'Courier New',ui-monospace,monospace;font-size:clamp(1.05rem,3vw,1.55rem);font-weight:700;letter-spacing:.06em;background:var(--surface2);border:3px dashed var(--line);padding:.6rem .8rem;word-break:break-all;-webkit-user-select:all;user-select:all}
.codes{width:100%;font-family:'Courier New',ui-monospace,monospace;font-size:1rem;padding:.6rem;border:3px solid var(--line);background:var(--surface);color:var(--ink);margin:0 0 .8rem}
.tablewrap{overflow-x:auto;margin:0 0 1rem;border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.ctable{border-collapse:collapse;width:100%;background:var(--surface);font-size:.95rem}
.ctable th,.ctable td{border:2px solid var(--line);padding:.45rem .6rem;text-align:left;white-space:nowrap}
.ctable th{font-family:var(--px);font-size:.5rem;line-height:1.6;background:var(--surface2)}
.ctable .ok{color:var(--good);font-weight:700}
.ctable .no{color:var(--bad);font-weight:700}
/* Game-design round 2 */
.arena.p2 .stage::before{content:'';position:absolute;inset:0;background:rgba(216,40,0,.2);pointer-events:none;z-index:1}
@media (prefers-reduced-motion:no-preference){.arena.p2 .stage::before{animation:alarm 1.2s steps(2) infinite}}
@keyframes alarm{50%{background:rgba(216,40,0,.04)}}
.wager{border:4px dashed #F8B800;background:var(--hintbg);padding:.9rem 1rem;margin:0 0 1rem}
.wager p{margin:0 0 .7rem}
.wager.on p{margin:0;font-weight:700}
.decide{border-color:#F8B800 !important}
.decide .clabel{font-family:var(--px);font-size:.6rem;line-height:1.6;margin:0 0 .5rem}
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:0 0 1rem}

{ emoji:"🏛️", badge:{en:"Capitol Listener",es:"Oyente del Capitolio"}, date:"1811–1812",

  text:{
    en:"Young members of Congress from the South and the West were angry at Britain. People called them {warhawk:War Hawks}. Their leaders were Henry Clay of Kentucky and John C. Calhoun of South Carolina.\nThe War Hawks said war would protect American honor. They blamed Britain for helping Native nations fight settlers on the {frontier:frontier}. Some hoped the United States could take over British Canada and gain land.\nNot everyone agreed. Many New England merchants, members of the {federalist:Federalist Party}, opposed the war because it would wreck their trade with Britain. In June 1812, Congress voted for war, 79 to 49 in the House and 19 to 13 in the Senate. It was one of the closest war votes in U.S. history.",

    q:{type:"mc",

      opts:[{en:"The exact words may not be his, but the main idea matches what he did",es:"Puede que las palabras exactas no sean suyas, pero la idea principal coincide con lo que hizo"},{en:"The speech is fake, so we should ignore it",es:"El discurso es falso, así que hay que ignorarlo"},{en:"Tecumseh wrote it himself in English",es:"Tecumseh lo escribió él mismo en inglés"},{en:"Translations are always perfect",es:"Las traducciones siempre son perfectas"}],
      ans:0,
      hint:{en:"Who wrote these words down? Could anything change during translation?",es:"¿Quién escribió estas palabras? ¿Podría cambiar algo al traducirlas?"},
      exp:{en:"A translated speech may not be word-for-word. But Tecumseh’s actions, building a united confederacy, back up the main idea.",es:"Un discurso traducido puede no ser exacto. Pero las acciones de Tecumseh, formar una confederación unida, apoyan la idea principal."}}
  },
  check:{type:"order",
    q:{en:"Put these events in order.",es:"Pon estos eventos en orden."},

    hint:{en:"Use the years in each event. The earliest goes at the top.",es:"Usa los años de cada evento. El más antiguo va arriba."},

  evidence:{en:"For Tecumseh’s confederacy, this was their own fight for independence: to keep their land and freedom from the United States.",es:"Para la confederación de Tecumseh, esta era su propia lucha por la independencia: conservar su tierra y su libertad frente a Estados Unidos."}
},
{ emoji:"⛵", badge:{en:"Lake Captain",es:"Capitán del Lago"}, date:"1812–1813",
  title:{en:"War on the Water",es:"Guerra en el agua"},
  ws:{en:"Box 4: How did “Old Ironsides” or Perry’s victory build American pride?",es:"Casilla 4: ¿Cómo aumentó el orgullo estadounidense «Old Ironsides» o la victoria de Perry?"},
  text:{
    en:"The Royal Navy had hundreds of warships. The U.S. Navy had only about 17. Still, Americans won some surprising fights at sea.\nIn August 1812, the {frigate:frigate} USS Constitution battled the British ship HMS Guerriere. British cannonballs seemed to bounce off the Constitution’s thick oak sides, so sailors nicknamed her “Old Ironsides.” She still floats in Boston Harbor today.\nOn land, things went badly. A U.S. invasion of Canada failed, and the British captured Detroit. Then in September 1813, Oliver Hazard Perry defeated the British fleet on Lake Erie. Without control of the lake, the British could not get supplies, so they had to leave Detroit.",
    simple:"Britain’s navy had hundreds of warships. The U.S. had only about 17. But Americans won some big fights.\nIn 1812, the USS Constitution beat a British {frigate:warship}. Cannonballs seemed to bounce off its thick wooden sides, so sailors called it “Old Ironsides.”\nOn land, the U.S. lost Detroit. Then in 1813, Oliver Hazard Perry beat the British on Lake Erie. Now Britain could not send supplies, so they left Detroit.",
    es:"La marina británica tenía cientos de barcos de guerra; la de Estados Unidos, solo unos 17. Aun así, los estadounidenses ganaron batallas sorprendentes.\nEn agosto de 1812, la {frigate:fragata} USS Constitution venció al barco británico HMS Guerriere. Las balas de cañón parecían rebotar en sus gruesos costados de roble, y los marineros la apodaron «Old Ironsides» (Costados de Hierro). Todavía flota en el puerto de Boston.\nEn tierra, la invasión de Canadá fracasó y los británicos tomaron Detroit. En septiembre de 1813, Oliver Hazard Perry derrotó a la flota británica en el lago Erie. Sin el lago, los británicos no podían recibir suministros y abandonaron Detroit."
  },
  source:{
    cite:{en:"Oliver Hazard Perry, note to General William Henry Harrison, September 10, 1813, written the day of the battle",es:"Oliver Hazard Perry, nota al general William Henry Harrison, 10 de septiembre de 1813, escrita el día de la batalla"},
    quote:"“We have met the enemy and they are ours: Two Ships, two Brigs one Schooner & one Sloop.”",
    plain:{en:"We fought the British and beat them. We captured six of their ships (ships, brigs, schooners, and sloops are all kinds of sailing ships).",es:"Peleamos contra los británicos y los vencimos. Capturamos seis de sus barcos (ships, brigs, schooners y sloops son tipos de barcos de vela)."},
    q:{type:"mc",
      q:{en:"Perry wrote this note on the same day as the battle. Why is that useful to a historian?",es:"Perry escribió esta nota el mismo día de la batalla. ¿Por qué es útil para un historiador?"},
      opts:[{en:"It is a firsthand account written right when the event happened",es:"Es un relato de primera mano escrito justo cuando ocurrió"},{en:"It was written by a British sailor",es:"Lo escribió un marinero británico"},{en:"It was written 50 years later, so Perry had time to think",es:"Se escribió 50 años después, así que Perry tuvo tiempo de pensar"},{en:"It is an advertisement from a newspaper",es:"Es un anuncio de un periódico"}],
      ans:0,
      hint:{en:"Who wrote it, and how long after the battle?",es:"¿Quién lo escribió y cuánto tiempo después de la batalla?"},
      exp:{en:"Perry was there and wrote it the same day, so it is a firsthand source close to the event. He was still on the winning side, so he showed it proudly.",es:"Perry estuvo allí y lo escribió ese mismo día: es una fuente de primera mano. Aun así, estaba del lado ganador y lo contó con orgullo."}}
  },
  check:{type:"mc",
    q:{en:"Why did the Battle of Lake Erie matter so much?",es:"¿Por qué fue tan importante la Batalla del lago Erie?"},
    opts:[{en:"It cut British supply lines, forcing the British out of Detroit",es:"Cortó los suministros británicos y los obligó a salir de Detroit"},{en:"It ended the war right away",es:"Terminó la guerra de inmediato"},{en:"It let Britain invade New York City",es:"Permitió a Gran Bretaña invadir Nueva York"},{en:"It was the battle where Washington, D.C. burned",es:"Fue la batalla en la que se quemó Washington, D.C."}],
    ans:0,
    hint:{en:"Think about how armies near the Great Lakes got food and supplies.",es:"Piensa en cómo recibían comida y suministros los ejércitos cerca de los Grandes Lagos."},
    exp:{en:"Supplies moved by water. Once Perry controlled Lake Erie, the British could not hold Detroit.",es:"Los suministros viajaban por agua. Cuando Perry controló el lago Erie, los británicos no pudieron mantener Detroit."}},
  evidence:{en:"The tiny U.S. Navy beat ships from the world’s most powerful navy, showing the young nation could stand up to Britain.",es:"La pequeña marina de EE. UU. venció a barcos de la marina más poderosa del mundo y demostró que la joven nación podía enfrentarse a Gran Bretaña."}
},
{ emoji:"🖼️", badge:{en:"Portrait Protector",es:"Protector del Retrato"}, date:"August 1814",
  title:{en:"Washington Burns",es:"Washington en llamas"},
  ws:{en:"Box 5: What did the British burn, and what reason did they give?",es:"Casilla 5: ¿Qué quemaron los británicos y qué razón dieron?"},
  text:{
    en:"In 1814, Britain defeated Napoleon in Europe. Now it could send many more soldiers to America.\nIn August 1814, British troops marched into Washington, D.C. President Madison and the government fled. The British set fire to the Capitol and the President’s House (today’s White House). Before leaving, First Lady Dolley Madison made sure a famous portrait of George Washington was saved.\nThe next day, a powerful storm helped put out the fires. Losing the capital was a huge embarrassment for the United States.",
    simple:"In 1814, Britain won its war in Europe. Now it could send more soldiers to America.\nIn August 1814, British troops marched into Washington, D.C. The president and Congress ran away. The British burned the Capitol and the President’s House (today’s White House). Dolley Madison, the First Lady, made sure a famous painting of George Washington was saved.\nIt was a big embarrassment for the United States.",
    es:"En 1814, Gran Bretaña derrotó a Napoleón en Europa y pudo enviar muchos más soldados a América.\nEn agosto de 1814, las tropas británicas entraron en Washington, D.C. El presidente Madison y el gobierno huyeron. Los británicos incendiaron el Capitolio y la Casa del Presidente (hoy la Casa Blanca). Antes de irse, la primera dama Dolley Madison se aseguró de que salvaran un famoso retrato de George Washington.\nAl día siguiente, una fuerte tormenta ayudó a apagar los incendios. Perder la capital fue una gran vergüenza para Estados Unidos."
  },
  other:{title:{en:"View from Upper Canada",es:"Desde el Alto Canadá"},
    text:{en:"The British said burning Washington was partly revenge. In 1813, American soldiers had burned government buildings in York (today’s Toronto), the capital of Upper Canada.",es:"Los británicos dijeron que quemar Washington fue en parte una venganza. En 1813, soldados estadounidenses habían quemado edificios del gobierno en York (hoy Toronto), la capital del Alto Canadá."}},
  source:{
    cite:{en:"Dolley Madison, letter to her sister, dated August 23–24, 1814",es:"Dolley Madison, carta a su hermana, fechada el 23 y 24 de agosto de 1814"},
    quote:"“Our kind friend, Mr. Carroll, has come to hasten my departure, and is in a very bad humor with me because I insist on waiting until the large picture of General Washington is secured.”",
    plain:{en:"Our friend Mr. Carroll came to hurry me out. He’s annoyed with me because I won’t leave until the big painting of George Washington is safe.",es:"Nuestro amigo, el señor Carroll, vino a apurarme. Está molesto conmigo porque no me iré hasta que el gran retrato de George Washington esté a salvo."},
    q:{type:"mc",
      q:{en:"The original letter is lost. Dolley Madison wrote out this copy years later. Paul Jennings, a young man enslaved by the Madisons, later wrote that other workers actually took the painting down. What should a historian conclude?",es:"La carta original se perdió. Dolley Madison escribió esta copia años después. Paul Jennings, un joven esclavizado por los Madison, escribió más tarde que otros trabajadores bajaron el cuadro. ¿Qué debe concluir un historiador?"},
      opts:[{en:"Dolley may have shaped the story to look good, so we should compare other sources",es:"Dolley pudo haber arreglado la historia para quedar bien, así que debemos comparar otras fuentes"},{en:"The painting was never saved",es:"El cuadro nunca se salvó"},{en:"Paul Jennings was not at the President’s House",es:"Paul Jennings no estaba en la Casa del Presidente"},{en:"One source is always enough",es:"Una sola fuente siempre es suficiente"}],
      ans:0,
      hint:{en:"When was this copy written? Does another eyewitness tell the story differently?",es:"¿Cuándo se escribió esta copia? ¿Otro testigo cuenta la historia de otra manera?"},
      exp:{en:"Because she rewrote it later, Dolley may have polished her role. Jennings’s account helps us corroborate: the painting was saved, but many people did the work.",es:"Como la reescribió después, Dolley pudo haber mejorado su papel. El relato de Jennings nos ayuda a comparar: el cuadro se salvó, pero muchas personas hicieron el trabajo."}}
  },
  check:{type:"mc",
    q:{en:"According to the British, why did they burn Washington?",es:"Según los británicos, ¿por qué quemaron Washington?"},
    opts:[{en:"Partly as revenge for Americans burning York, the capital of Upper Canada",es:"En parte como venganza porque los estadounidenses quemaron York, la capital del Alto Canadá"},{en:"Because Dolley Madison started the fire",es:"Porque Dolley Madison empezó el incendio"},{en:"To celebrate the end of the war",es:"Para celebrar el fin de la guerra"},{en:"Because Washington was Britain’s capital",es:"Porque Washington era la capital de Gran Bretaña"}],
    ans:0,
    hint:{en:"Reread the “View from Upper Canada” box.",es:"Vuelve a leer el recuadro «Desde el Alto Canadá»."},
    exp:{en:"Americans burned York in 1813. The British pointed to that when they burned Washington in 1814.",es:"Los estadounidenses quemaron York en 1813. Los británicos lo usaron como razón para quemar Washington en 1814."}},
  evidence:{en:"The British burned America’s capital. The U.S. could not even protect its own government.",es:"Los británicos quemaron la capital. Estados Unidos ni siquiera pudo proteger a su propio gobierno."}
},
{ emoji:"🌅", badge:{en:"Dawn Watcher",es:"Vigía del Amanecer"}, date:"September 1814",
  title:{en:"The Rockets’ Red Glare",es:"El resplandor de los cohetes"},
  ws:{en:"Box 6: Why was the flag over Fort McHenry such a big deal?",es:"Casilla 6: ¿Por qué fue tan importante la bandera sobre el Fuerte McHenry?"},
  text:{
    en:"After burning Washington, the British sailed to attack Baltimore. On September 13–14, 1814, British warships fired bombs and rockets at Fort McHenry for about 25 hours. This kind of attack is called a {bombardment:bombardment}.\nFrancis Scott Key, an American lawyer, watched from a ship in the harbor. He had gone to ask the British to free an American prisoner. At dawn, Key saw a huge American flag still flying over the fort. The fort had held!\nKey wrote a poem about that morning. It was set to music and became “The Star-Spangled Banner.” In 1931, it became the national {anthem:anthem}.",
    simple:"Next, the British attacked the city of Baltimore. For about 25 hours, British ships fired bombs and rockets at Fort McHenry. This is called a {bombardment:bombardment}.\nFrancis Scott Key, an American lawyer, watched from a ship. In the morning, he saw the American flag still flying. The fort did not fall!\nKey wrote a poem about it. It became “The Star-Spangled Banner,” our national {anthem:anthem}.",
    es:"Después de quemar Washington, los británicos atacaron Baltimore. El 13 y 14 de septiembre de 1814, barcos británicos lanzaron bombas y cohetes contra el Fuerte McHenry durante unas 25 horas. Este ataque se llama {bombardment:bombardeo}.\nFrancis Scott Key, un abogado estadounidense, lo vio desde un barco en el puerto. Había ido a pedir la liberación de un prisionero. Al amanecer, vio una enorme bandera estadounidense que seguía ondeando. ¡El fuerte resistió!\nKey escribió un poema sobre esa mañana. Con música, se convirtió en «The Star-Spangled Banner». En 1931 se convirtió en el {anthem:himno} nacional."
  },
  source:{
    cite:{en:"Francis Scott Key, “Defence of Fort M’Henry,” September 1814",es:"Francis Scott Key, «Defensa del Fuerte McHenry», septiembre de 1814"},
    quote:"“O say can you see by the dawn’s early light, / What so proudly we hailed at the twilight’s last gleaming.”",
    plain:{en:"Can you see, in the early morning light, the flag we proudly saluted last night as the sun went down?",es:"¿Puedes ver, con la primera luz de la mañana, la bandera que saludamos con orgullo anoche al ponerse el sol?"},
    q:{type:"mc",
      q:{en:"Key was an American watching his country’s fort under attack. How does his point of view shape the poem?",es:"Key era un estadounidense que veía atacar el fuerte de su país. ¿Cómo influye su punto de vista en el poema?"},
      opts:[{en:"He was hoping for an American victory, so the poem shows pride and relief",es:"Esperaba una victoria estadounidense, así que el poema muestra orgullo y alivio"},{en:"He was neutral and did not care who won",es:"Era neutral y no le importaba quién ganara"},{en:"He was a British officer celebrating the attack",es:"Era un oficial británico que celebraba el ataque"},{en:"He wrote it as a news report full of exact numbers",es:"Lo escribió como un reportaje con números exactos"}],
      ans:0,
      hint:{en:"Which side was Key on? How would you feel seeing your flag still flying after a night of bombs?",es:"¿De qué lado estaba Key? ¿Cómo te sentirías al ver tu bandera ondeando tras una noche de bombas?"},
      exp:{en:"Key was an American who feared the fort would fall. His poem is about feelings, especially pride, more than facts and figures.",es:"Key era estadounidense y temía que el fuerte cayera. Su poema trata de sentimientos, sobre todo orgullo, más que de datos."}}
  },
  check:{type:"order",
    q:{en:"Put these events in order.",es:"Pon estos eventos en orden."},
    items:[{en:"The British burn Washington, D.C. (August 1814)",es:"Los británicos queman Washington, D.C. (agosto de 1814)"},{en:"British ships bombard Fort McHenry (September 1814)",es:"Barcos británicos bombardean el Fuerte McHenry (septiembre de 1814)"},{en:"Key sees the flag at dawn and writes a poem",es:"Key ve la bandera al amanecer y escribe un poema"},{en:"“The Star-Spangled Banner” becomes the national anthem (1931)",es:"«The Star-Spangled Banner» se convierte en el himno nacional (1931)"}],
    hint:{en:"Washington burned first. The anthem came more than 100 years later.",es:"Primero se quemó Washington. El himno llegó más de 100 años después."},
    exp:{en:"Washington burned, then Fort McHenry was bombarded, Key wrote his poem at dawn, and much later it became the anthem.",es:"Washington se quemó, luego bombardearon el Fuerte McHenry, Key escribió su poema al amanecer y mucho después se convirtió en himno."}},
  evidence:{en:"Fort McHenry held, and Key’s song became a symbol of national pride. Americans felt they had defended their freedom.",es:"El Fuerte McHenry resistió y la canción de Key se volvió un símbolo de orgullo nacional. Los estadounidenses sintieron que habían defendido su libertad."}
},
{ emoji:"🛡️", badge:{en:"Bayou Defender",es:"Defensor del Bayou"}, date:"January 1815",
  title:{en:"Victory at New Orleans",es:"Victoria en Nueva Orleans"},
  ws:{en:"Box 7: Why was the Battle of New Orleans fought after the war was over?",es:"Casilla 7: ¿Por qué se peleó la Batalla de Nueva Orleans después de que la guerra terminó?"},
  text:{
    en:"Next, the British tried to capture New Orleans, the city that controlled trade on the Mississippi River. General Andrew Jackson gathered a mixed army: U.S. soldiers, frontier {militia:militia}, free Black soldiers, Choctaw warriors, and even Jean Lafitte’s pirates.\nOn January 8, 1815, the British attacked Jackson’s earthen walls. In less than an hour, about 2,000 British soldiers were killed, wounded, or captured. Fewer than 100 Americans were.\nHere is the strange part: the peace treaty had already been signed on December 24, 1814! News crossed the Atlantic by sailing ship, so nobody in New Orleans knew. The victory made Jackson a national hero.",
    simple:"Britain then attacked New Orleans, an important city on the Mississippi River. General Andrew Jackson led a mixed army of soldiers, {militia:militia}, free Black soldiers, Choctaw warriors, and pirates.\nOn January 8, 1815, they crushed the British attack. About 2,000 British soldiers were killed, hurt, or captured. Fewer than 100 Americans were.\nBut the war was already over! A peace treaty was signed two weeks before. The news had not crossed the ocean yet. Jackson became a hero.",
    es:"Después, los británicos intentaron tomar Nueva Orleans, la ciudad que controlaba el comercio del río Misisipi. El general Andrew Jackson reunió un ejército mixto: soldados, {militia:milicia} de la frontera, soldados negros libres, guerreros choctaw y hasta los piratas de Jean Lafitte.\nEl 8 de enero de 1815, los británicos atacaron. En menos de una hora, unos 2,000 soldados británicos murieron, fueron heridos o capturados. Del lado estadounidense fueron menos de 100.\nLo extraño: ¡el tratado de paz ya se había firmado el 24 de diciembre de 1814! Las noticias cruzaban el océano en barcos de vela y nadie en Nueva Orleans lo sabía. La victoria convirtió a Jackson en héroe nacional."
  },
  source:{
    cite:{en:"General Andrew Jackson, proclamation “To the Free Colored Inhabitants of Louisiana,” September 21, 1814",es:"General Andrew Jackson, proclama «A los habitantes libres de color de Luisiana», 21 de septiembre de 1814"},
    quote:"“Through a mistaken policy you have heretofore been deprived of a participation in the glorious struggle for national rights in which our country is engaged. This no longer shall exist.”",
    plain:{en:"Until now, you have unfairly been kept out of the fight for our country’s rights. That will not happen anymore.",es:"Hasta ahora, injustamente no los han dejado participar en la lucha por los derechos de nuestro país. Eso ya no pasará."},
    q:{type:"mc",
      q:{en:"Andrew Jackson enslaved people on his own plantation. Why do you think he invited free Black men to join his army in 1814?",es:"Andrew Jackson esclavizaba a personas en su plantación. ¿Por qué crees que invitó a hombres negros libres a unirse a su ejército en 1814?"},
      opts:[{en:"He badly needed more soldiers to defend New Orleans",es:"Necesitaba urgentemente más soldados para defender Nueva Orleans"},{en:"He wanted to end slavery in the United States",es:"Quería acabar con la esclavitud en Estados Unidos"},{en:"The British ordered him to",es:"Los británicos se lo ordenaron"},{en:"The war was already over",es:"La guerra ya había terminado"}],
      ans:0,
      hint:{en:"What was about to happen in New Orleans? What did Jackson need most?",es:"¿Qué estaba por pasar en Nueva Orleans? ¿Qué necesitaba Jackson más que nada?"},
      exp:{en:"Jackson needed troops fast. His words praise “national rights,” but he did not support equal rights for Black Americans. Always ask why a source was created.",es:"Jackson necesitaba tropas rápido. Sus palabras hablan de «derechos nacionales», pero no apoyaba la igualdad para los afroamericanos. Siempre pregunta por qué se creó una fuente."}}
  },
  check:{type:"mc",
    q:{en:"What was surprising about the timing of the Battle of New Orleans?",es:"¿Qué tuvo de sorprendente el momento de la Batalla de Nueva Orleans?"},
    opts:[{en:"It was fought after the peace treaty had already been signed",es:"Se peleó después de que ya se había firmado el tratado de paz"},{en:"It was the first battle of the war",es:"Fue la primera batalla de la guerra"},{en:"It happened before the U.S. declared war",es:"Ocurrió antes de que EE. UU. declarara la guerra"},{en:"It lasted three years",es:"Duró tres años"}],
    ans:0,
    hint:{en:"Compare the date of the battle with the date the treaty was signed.",es:"Compara la fecha de la batalla con la fecha en que se firmó el tratado."},
    exp:{en:"The treaty was signed December 24, 1814. The battle was January 8, 1815. Slow news meant the fighting continued.",es:"El tratado se firmó el 24 de diciembre de 1814. La batalla fue el 8 de enero de 1815. Las noticias lentas hicieron que siguieran peleando."}},
  evidence:{en:"The huge win at New Orleans made Americans feel they had beaten Britain, even though the treaty was already signed.",es:"La gran victoria en Nueva Orleans hizo sentir a los estadounidenses que habían vencido a Gran Bretaña, aunque el tratado ya estaba firmado."}
},
{ emoji:"📜", badge:{en:"Treaty Decoder",es:"Descifrador de Tratados"}, date:"1815",
  title:{en:"Who Got What?",es:"¿Quién ganó qué?"},
  ws:{en:"Box 8: Name one group that came out ahead and one group that lost.",es:"Casilla 8: Nombra un grupo que salió ganando y uno que perdió."},
  text:{
    en:"The Treaty of Ghent ended the war. It put things back to the {statusquo:status quo}, the way they were before the war. No land changed hands, and the treaty did not even mention impressment. (Britain stopped impressment anyway once its war with France ended.)\nStill, the war changed a lot. Americans felt a new wave of {nationalism:nationalism}, or pride in their country. Andrew Jackson became so popular that he was later elected president. The {federalist:Federalists} had held the Hartford Convention to complain about the war, and some even talked about New England leaving the Union. When news of New Orleans and peace arrived, they looked disloyal, and their party soon collapsed.\nThe biggest losers were Native nations. With Tecumseh dead and Britain gone, they lost their strongest {ally:ally}. After defeating the Creek Nation in 1814, Jackson forced the Creeks to give up about 23 million acres.",
    simple:"The Treaty of Ghent ended the war. It put things back to the {statusquo:status quo}, the way they were before. No land changed hands.\nBut Americans felt very proud of their country. This is called {nationalism:nationalism}. Andrew Jackson became a hero and later president. The {federalist:Federalists} had complained about the war at the Hartford Convention. Now they looked disloyal, and their party fell apart.\nNative nations lost the most. Tecumseh was dead, and Britain was no longer their {ally:ally}. Jackson forced the Creek Nation to give up about 23 million acres.",
    es:"El Tratado de Gante terminó la guerra. Todo volvió al {statusquo:statu quo}, como estaba antes. Nadie ganó tierras y el tratado ni siquiera mencionó el reclutamiento forzoso (Gran Bretaña lo dejó de hacer al terminar su guerra con Francia).\nAun así, la guerra cambió mucho. Los estadounidenses sintieron un nuevo {nationalism:nacionalismo}, un orgullo por su país. Andrew Jackson se volvió tan popular que luego fue presidente. Los {federalist:federalistas} se habían quejado de la guerra en la Convención de Hartford, y algunos hablaron de que Nueva Inglaterra dejara la Unión. Cuando llegaron las noticias de la paz y de Nueva Orleans, parecieron desleales y su partido desapareció.\nLos que más perdieron fueron las naciones nativas. Sin Tecumseh y sin Gran Bretaña, perdieron a su mejor {ally:aliado}. Tras derrotar a la Nación Creek en 1814, Jackson la obligó a entregar unos 23 millones de acres."
  },
  other:{title:{en:"View from Canada and Britain",es:"Desde Canadá y Gran Bretaña"},
    text:{en:"Many Canadians remember the war as a victory. They stopped several American invasions, and heroes like Isaac Brock and Laura Secord became part of Canada’s story. For Britain, it was a small war compared with the fight against Napoleon.",es:"Muchos canadienses recuerdan la guerra como una victoria: detuvieron varias invasiones estadounidenses, y héroes como Isaac Brock y Laura Secord son parte de su historia. Para Gran Bretaña, fue una guerra pequeña comparada con la lucha contra Napoleón."}},
  source:{
    cite:{en:"Treaty of Ghent, Article IX, signed December 24, 1814, by British and American diplomats",es:"Tratado de Gante, Artículo IX, firmado el 24 de diciembre de 1814 por diplomáticos británicos y estadounidenses"},
    quote:"“The United States of America engage to put an end immediately … to hostilities with all the Tribes or Nations of Indians with whom they may be at war … and forthwith to restore to such Tribes or Nations … all the possessions, rights, and privileges which they may have enjoyed … in one thousand eight hundred and eleven.”",
    plain:{en:"The United States promises to stop fighting Native nations right away and give back the land and rights they had in 1811.",es:"Estados Unidos promete dejar de pelear con las naciones nativas de inmediato y devolverles las tierras y derechos que tenían en 1811."},
    q:{type:"mc",
      q:{en:"Only British and American diplomats signed this treaty. No Native leaders were there. Why does that matter?",es:"Solo diplomáticos británicos y estadounidenses firmaron este tratado. No había líderes nativos. ¿Por qué importa eso?"},

/* ---------- Questions ---------- */
function initQ(key, qd){
  if (q && q.key === key) return;
  q = {key, attempts:0, solved:false, revealed:false, choice:null, wrong:[], rows:null};
  if (qd.type === "mc") q.perm = shuffle(qd.opts.map((_,j)=>j));
  if (qd.type === "order"){
    const idx = qd.items.map((_,i)=>i);
    let o; do { o = shuffle(idx); } while (o.every((v,i)=>v===i));
    q.order = o;
  }
  if (qd.type === "match"){
    q.rorder = shuffle(qd.right.map((_,i)=>i));
    q.match = qd.left.map(()=> "");
  }
}
function qHTML(qd, contLabel){
  const finished = q.solved || q.revealed;
  let h = `<p class="qtext" id="qt">${L(qd.q)}</p>`;
  if (qd.type === "mc"){
    h += `<div class="opts" role="radiogroup" aria-labelledby="qt">` + (q.perm || qd.opts.map((_,j)=>j)).filter(i => !finished || i === qd.ans).map(i=>{ const o = qd.opts[i];
      const cls = (finished && i===qd.ans) ? " right" : q.wrong.includes(i) ? " wrong" : "";
      return `<button type="button" role="radio" class="opt${cls}" aria-checked="${q.choice===i}" data-act="pick" data-i="${i}" ${finished||q.wrong.includes(i)?"disabled":""}><span class="dot" aria-hidden="true"></span><span>${L(o)}</span></button>`;
    }).join("") + `</div>`;
  } else if (qd.type === "order"){
    h += `<p class="inst">${t("orderInst")}</p><ol class="olist">` + q.order.map((it,pos)=>{
      const cls = q.rows ? (q.rows[pos] ? " good" : " badrow") : (finished ? " good" : "");
      return `<li class="${cls}"><span class="n" aria-hidden="true">${pos+1}</span><span class="txt">${L(qd.items[it])}</span><span class="arr">
        <button type="button" data-act="mv" data-pos="${pos}" data-d="-1" aria-label="${t("up")}" ${pos===0||finished?"disabled":""}>▲</button>
        <button type="button" data-act="mv" data-pos="${pos}" data-d="1" aria-label="${t("down")}" ${pos===q.order.length-1||finished?"disabled":""}>▼</button></span></li>`;
    }).join("") + `</ol>`;
  } else if (qd.type === "match"){
    h += qd.left.map((lf,li)=>{
      const cls = q.rows ? (q.rows[li] ? " good" : " badrow") : (finished ? " good" : "");
      return `<div class="mrow${cls}"><label for="m${li}"><b>${L(lf)}</b></label><select id="m${li}" data-act="match" data-i="${li}" ${finished||(q.locked||[]).includes(li)?"disabled":""}>
        <option value="">${t("choose")}</option>${q.rorder.map(ri=>`<option value="${ri}" ${String(q.match[li])===String(ri)?"selected":""}>${L(qd.right[ri])}</option>`).join("")}</select></div>`;
    }).join("");
  }
  if (q.solved) h += `<div class="fb good" role="status"><p class="h">${t("correct")}${q.attempts===0 && /^[sc]\d/.test(q.key)?" ⭐":""}</p><p>${L(qd.exp)}</p></div>`;
  else if (q.revealed) h += `<div class="fb bad" role="status"><p class="h">${t("notQuite")}</p>${answerText(qd)}<p>${L(qd.exp)}</p></div>`;
  else if (q.attempts === 1) h += `<div class="fb hint" role="status"><p><span class="h">${t("hint")}</span> ${L(qd.hint)}</p></div>`;
  h += `<div class="actions">`;
  if (!finished && (inv().hint || 0) > 0 && !q.hinted) h += `<button type="button" class="hintbtn" data-act="usehint">🧭 ${t("useHint")} (${inv().hint})</button>`;
  if (!finished) h += `<button type="button" class="btn" data-act="submit" ${ready(qd)?"":"disabled"}>${q.attempts===1?t("tryAgain"):t("checkAns")}</button>`;
  else h += `<button type="button" class="btn" data-act="next">${contLabel || t("cont")}</button>`;
  h += `</div>`;
  return h;
}
function answerText(qd){
  if (qd.type === "mc") return "";
  if (qd.type === "order") return `<p>${qd.items.map((x,i)=>`${i+1}. ${L(x)}`).join("<br>")}</p>`;
  return `<p>${qd.left.map((x,i)=>`<b>${L(x)}</b>: ${L(qd.right[i])}`).join("<br>")}</p>`;
}
function ready(qd){
  if (qd.type === "mc") return q.choice !== null;
  if (qd.type === "match") return q.match.every(v => v !== "");
  return true;
}
function isRight(qd){
  if (qd.type === "mc") return q.choice === qd.ans;
  if (qd.type === "order"){ q.rows = q.order.map((v,i)=>v===i); return q.rows.every(Boolean); }
  q.rows = q.match.map((v,i)=>String(v)===String(i)); return q.rows.every(Boolean);
}
function submit(qd, key){
  if (isRight(qd)){
    q.solved = true; q.rows = null;
    if (q.attempts === 0){ st.fts = (st.fts || 0) + 1; st.ftsMax = Math.max(st.ftsMax || 0, st.fts); }
    if (q.attempts === 0 && /^[sc]\d/.test(key)) st.stars[key] = 1;
  } else {
    q.attempts++; st.fts = 0;
    if (q.attempts === 1 && !/^b/.test(key)){ st.missed = st.missed || []; if (!st.missed.includes(key)) st.missed.push(key); }
    if (qd.type === "mc"){ q.wrong.push(q.choice); q.choice = null; }
    if (q.attempts >= 2){ q.revealed = true; q.rows = null;
      if (qd.type === "order") q.order = qd.items.map((_,i)=>i);
      if (qd.type === "match") q.match = qd.left.map((_,i)=>String(i));
    }
  }
}

function layoutMap(){
  const route = document.getElementById("route"), trail = document.getElementById("trail"), ship = document.getElementById("ship");
  if (!route || !ship || typeof route.getTotalLength !== "function") return;
  let len; try { len = route.getTotalLength(); } catch(e) { return; }
  if (!len) return;
  const at = k => route.getPointAtLength(len * k / 9);
  document.querySelectorAll(".port").forEach(el => { const p = at(+el.dataset.k); el.style.left = p.x/10 + "%"; el.style.top = p.y/1.75 + "%"; });
  const target = st.gameOn != null ? GAME_AFTER[st.gameOn] + 1.5 : (st.hard || st.duel) ? 9 : st.boss ? 8.7 : st.i < 0 ? 0 : st.i >= S.length ? 9 : st.i + 1;
  const from = typeof st.shipAt === "number" ? st.shipAt : target;
  const put = k => { const p = at(k); ship.style.left = p.x/10 + "%"; ship.style.top = p.y/1.75 + "%"; trail.style.strokeDasharray = `${len*k/9} ${len}`; };
  st.shipAt = target; save();
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (from === target || reduce){ put(target); return; }
  ship.classList.toggle("left", target < from);
  ship.classList.add("sailing");
  const t0 = performance.now(), dur = Math.min(2600, 700 * Math.abs(target - from) + 500);
  put(from);
  const step = now => {
    if (!document.body.contains(ship)) return;
    const x = Math.min(1, (now - t0) / dur), e = x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
    put(from + (target - from) * e);
    if (x < 1) requestAnimationFrame(step); else { ship.classList.remove("sailing", "left"); }
  };

}

function shakeEl(el){ if (el) el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px) rotate(-2deg)'},{transform:'translateX(7px) rotate(2deg)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}], {duration:450}); }
function confetti(host, fixed){

function shoot(ar, side, kind, cb){

function playOutcome(o){
  const ar = document.getElementById('arena'); if (!ar) return;
  const b = battleCfg();
  const B = bt;
  const done = () => { if (!B || bt !== B) return; B.shownE = B.enemy; B.shownP = B.player; B.shownFire = B.fire; applyScene(b); };
  if (reduceMotion()){ done(); if (bt.won) winFx(ar, b); return; }
  if (o.type === 'hit' && o.first && bt.streak >= 2) setTimeout(() => bannerFx(ar, `🔥 ${bt.streak} ${t('inARow')}`, 1300), 120);
  if (b.kind === 'battle'){
    shoot(ar, o.type === 'hit' ? 'l' : 'r', o.type === 'hit' ? 'ball' : (b.enemyProj || 'ball'), pt => {

      if (bt === B && B.won) setTimeout(() => winFx(ar, b), 450);
    };
  } else {
    shakeEl(ar.querySelector('.stage')); floaty(ar, '😬', ar.clientWidth/2, ar.clientHeight/2, ''); done();

function startCatch(){
  const box = document.getElementById('gbox');
  game = {id:'catch', alive:true, score:0, left:45, caught:new Set(), wrong:new Set(), ts:[], last:performance.now(), spawn:0};
  box.addEventListener('pointerdown', e => {
    const tg = e.target.closest('.tgt'); if (!tg || !game || game.id !== 'catch') return;
    const T = game.ts.find(x => x.el === tg); if (!T || T.hit) return;
    T.hit = true; tg.classList.add('hit');
    const r = rel(box, tg, .5, .3);
    if (T.good){ SFX.ding(); addPts(100); game.caught.add(T.k); boom(box, r.x, r.y); floaty(box, '+100 🪙', r.x, r.y - 20, 'gold'); }
    else { SFX.buzz(); addPts(-50); game.wrong.add(T.k); floaty(box, '✘ ' + t('notACause'), r.x, r.y - 20, 'red'); shakeEl(box); }
    setTimeout(() => tg.remove(), 350);
  });
  const loop = now => {
    if (!game || !game.alive) return;
    const dt = Math.min(.05, (now - game.last)/1000); game.last = now;
    game.left -= dt; game.spawn -= dt;
    const W = box.clientWidth, H = box.clientHeight;
    if (game.spawn <= 0 && game.ts.length < 5){ spawnGull(box, W, H); game.spawn = .9 + Math.random()*.5; }
    game.ts.forEach(T => { if (T.hit) return; T.x += T.vx*dt; T.ph += dt*3; T.el.style.transform = `translate(${T.x}px,${T.y + Math.sin(T.ph)*10}px)`; if ((T.vx > 0 && T.x > W + 20) || (T.vx < 0 && T.x < -T.w - 20)){ T.hit = true; T.el.remove(); } });
    game.ts = game.ts.filter(T => !T.hit);
    setHud([[t('score'), game.score],[t('time'), Math.ceil(Math.max(0, game.left))]]);
    if (game.left <= 0) return endGame();
    game.raf = requestAnimationFrame(loop);
  };
  game.raf = requestAnimationFrame(loop);
}
function spawnGull(box, W, H){

  el.style.transform = `translate(${T.x}px,${T.y}px)`; game.ts.push(T);

function startRocket(){
  const box = document.getElementById('gbox');
  game = {id:'rocket', alive:true, score:0, rounds: shuffle(EVENTS.map((_,i) => i)).slice(0,8), r:-1, rk:[], got:[], last:performance.now(), wait:0};
  box.addEventListener('pointerdown', e => {
    const b = e.target.closest('.rk'); if (!b || !game || game.id !== 'rocket' || game.wait > 0) return;
    const R = game.rk.find(x => x.el === b); if (!R || R.dead) return;
    const p = rel(box, b, .5, .5); R.dead = true;
    if (R.good){ SFX.answer(true); b.remove(); boom(box, p.x, p.y); const pts = 100 + Math.round(Math.max(0, 1 - R.y/game.ground)*50); addPts(pts); floaty(box, `+${pts} 🪙`, p.x, p.y - 20, 'gold'); game.got.push(game.rounds[game.r]); clearRockets(); game.wait = .8; }
    else { SFX.answer(false); b.classList.add('dud'); addPts(-25); floaty(box, '✘', p.x, p.y - 10, 'red'); }
  });
  nextRound(box);
  const loop = now => {
    if (!game || !game.alive) return;
    const dt = Math.min(.05, (now - game.last)/1000); game.last = now;
    if (game.wait > 0){ game.wait -= dt; if (game.wait <= 0) nextRound(box); }
    else game.rk.forEach(R => {
      if (R.dead) return;
      R.y += R.vy*dt; R.el.style.transform = `translate(${R.x}px,${R.y}px) translateX(-50%)`;
      if (R.y >= game.ground){ R.dead = true; R.el.remove(); boom(box, R.x, game.ground + 40); shakeEl(box);
        if (R.good){ const ev = EVENTS[game.rounds[game.r]]; floaty(box, `${L([ev[1], ev[2]])}: ${ev[0]}`, box.clientWidth/2, 130, ''); clearRockets(); game.wait = 1.8; } }
    });
    if (!game || !game.alive) return;
    setHud([[t('score'), game.score],[t('round'), `${Math.min(game.r + 1, game.rounds.length)}/${game.rounds.length}`]]);
    game.raf = requestAnimationFrame(loop);
  };
  game.raf = requestAnimationFrame(loop);
}
function clearRockets(){ game.rk.forEach(R => { if (!R.dead){ R.dead = true; R.el.classList.add('dud'); } setTimeout(() => R.el.remove(), 400); }); }
function nextRound(box){

  let pr = document.getElementById('gprompt'); if (!pr){ pr = document.createElement('div'); pr.className = 'prompt'; pr.id = 'gprompt'; box.appendChild(pr); }

  const yrs = shuffle([ev[0], ...shuffle(YEARS.filter(y => y !== ev[0])).slice(0,2)]), lanes = [.2,.5,.8], W = box.clientWidth;

    const R = {el, good: y === ev[0], x: W*lanes[i], y: 40 + Math.random()*30, vy: 36 + game.r*4 + Math.random()*12, dead:false}; el.style.transform = `translate(${R.x}px,${R.y}px) translateX(-50%)`; return R; });
