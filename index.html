function startDrop(){
  const box = document.getElementById('gbox');
  const pick = [0,1,2].map(s => shuffle(DROPS.filter(d => d[0] === s)).slice(0,4)).flat();
  game = {id:'drop', alive:true, score:0, queue: shuffle(pick), n:0, rows:7, stacks:[0,0,0], cur:null, speed:850, wrong:[], right:0};
  game.key = e => { if (!game || game.id !== 'drop') return;
    if (e.key === 'ArrowLeft' || e.key === 'a'){ dMove(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd'){ dMove(1); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === ' '){ dDrop(); e.preventDefault(); } };
  document.addEventListener('keydown', game.key);
  box.addEventListener('pointerdown', e => { if (!game || game.id !== 'drop' || !game.cur) return; const r = box.getBoundingClientRect(); const c = Math.max(0, Math.min(2, Math.floor((e.clientX - r.left)/r.width*3))); if (game.cur.row <= game.rows - 1 - game.stacks[c]){ game.cur.col = c; dPlace(); } });
  dSpawn(); game.iv = setInterval(dTick, game.speed);
}
function cellH(){ const b = document.getElementById('gbox'); return b ? b.clientHeight/game.rows : 46; }
function dSpawn(){
  if (!game || !game.alive) return;
  if (game.n >= game.queue.length) return endGame();
  const box = document.getElementById('gbox'), it = game.queue[game.n++];
  const el = document.createElement('div'); el.className = 'blk'; el.textContent = L([it[1], it[2]]); el.style.height = (cellH() - 6) + 'px'; box.appendChild(el);
  game.cur = {it, el, col:1, row:0}; dPlace();
  setHud([[t('score'), game.score],[t('left'), game.queue.length - game.n + 1]]);
}
function dPlace(){ const c = game && game.cur; if (!c) return; c.el.style.left = (c.col*33.333) + '%'; c.el.style.top = (c.row*cellH() + 3) + 'px'; }
function dMove(d){ if (!game || game.id !== 'drop' || !game.cur) return; const c = game.cur, nc = Math.max(0, Math.min(2, c.col + d)); if (c.row > game.rows - 1 - game.stacks[nc]) return; c.col = nc; dPlace(); }
function dDrop(){ if (!game || game.id !== 'drop' || !game.cur) return; game.cur.row = game.rows - 1 - game.stacks[game.cur.col]; dPlace(); setTimeout(() => { if (game && game.cur) dLand(); }, 130); }
function dTick(){ if (!game || !game.cur) return; const c = game.cur; if (c.row >= game.rows - 1 - game.stacks[c.col]) return dLand(); c.row++; dPlace(); }
function dLand(){
  const c = game && game.cur; if (!c) return; game.cur = null;
  const box = document.getElementById('gbox'), p = rel(box, c.el, .5, .5);
  if (c.it[0] === c.col){ SFX.ding(); addPts(100); game.right++; c.el.classList.add('good'); const f = document.createElement('div'); f.className = 'colflash'; f.style.left = (c.col*33.333) + '%'; box.appendChild(f); setTimeout(() => f.remove(), 500); floaty(box, '+100 🪙', p.x, p.y - 10, 'gold'); puffs(box, p.x, p.y, 3); setTimeout(() => c.el.remove(), 230); }
  else { SFX.buzz(); game.stacks[c.col]++; c.el.classList.add('wrong'); c.el.innerHTML = `${L([c.it[1], c.it[2]])}<small>→ ${L(SIDES[c.it[0]])}</small>`; game.wrong.push(c.it); shakeEl(box); floaty(box, '✘', p.x, p.y - 10, 'red');

function startMatch(gm){
  const cards = shuffle(PAIRS.flatMap((p,i) => [{pair:i, kind:'person', txt:p[0]}, {pair:i, kind:'clue', txt:p[1]}]));
  game = {id:'match', alive:true, score:0, cards, open:[], matched:0, misses:0, t0:null, lock:false};
  gm.innerHTML = `<div class='mgrid' id='gbox'>${cards.map((c,i) => `<button type='button' class='card' data-act='mflip' data-i='${i}' aria-label='${t('card')} ${i+1}'><span class='in'><span class='b' aria-hidden='true'>⚓</span><span class='f ${c.kind}'>${L(c.txt)}</span></span></button>`).join('')}</div>`;
  setHud([[t('moves'), 0],[t('pairs'), '0/6']]);
  game.iv = setInterval(() => { if (game && game.t0) setHud([[t('moves'), game.misses],[t('pairs'), `${game.matched}/6`],[t('time'), Math.round((performance.now() - game.t0)/1000) + 's']]); }, 500);
}
function mFlip(i){
  if (!game || game.id !== 'match' || game.lock) return;
  const el = document.querySelector(`.card[data-i='${i}']`), c = game.cards[i];
  if (!el || c.up) return;
  if (!game.t0) game.t0 = performance.now();
  c.up = true; el.classList.add('up'); el.setAttribute('aria-label', L(c.txt)); game.open.push(i);
  if (game.open.length < 2) return;
  const [a,b] = game.open;
  if (game.cards[a].pair === game.cards[b].pair){
    game.open = []; game.matched++; SFX.ding();
    [a,b].forEach(k => document.querySelector(`.card[data-i='${k}']`).classList.add('matched'));
    const box = document.getElementById('gbox'), r = rel(box, el, .5, .3); floaty(box, '✔', r.x, r.y, 'gold');
    if (game.matched === PAIRS.length) setTimeout(endGame, 800);
  } else {
    game.misses++; game.lock = true; SFX.buzz();
    setTimeout(() => { if (!game) return; [a,b].forEach(k => { game.cards[k].up = false; const e = document.querySelector(`.card[data-i='${k}']`); if (e){ e.classList.remove('up'); e.setAttribute('aria-label', `${t('card')} ${k+1}`); } }); game.open = []; game.lock = false; }, 1000);
  }
}

function reviewHTML(G){
  if (G.id === 'catch') return `<p><b>${t('causesList')}</b></p><ul class='rev'>${CAUSES.map((c,k) => `<li>${G.caught.has(k) ? '✔' : '○'} ${L(c)}</li>`).join('')}</ul>` + (G.wrong.size ? `<p><b>${t('notCauses')}</b></p><ul class='rev'>${[...G.wrong].map(k => `<li>✘ <b>${L(NOTCAUSES[k])}</b>: ${L([NOTCAUSES[k][2], NOTCAUSES[k][3]])}</li>`).join('')}</ul>` : '');
  if (G.id === 'drop') return (G.toppled ? `<p><b>${t('toppled')}</b></p>` : '') + `<p><b>${t('sortScore')}:</b> ${G.right}/${G.n}</p>` + (G.wrong.length ? `<p><b>${t('wrongBlocks')}</b></p><ul class='rev'>${G.wrong.map(it => `<li>${L([it[1], it[2]])} → <b>${L(SIDES[it[0]])}</b></li>`).join('')}</ul>` : '');
  if (G.id === 'rocket'){ const seen = G.rounds.slice(0, Math.min(G.r + 1, G.rounds.length)).sort((a,b) => a - b); return `<p><b>${t('timeline')}</b></p><ul class='rev'>${seen.map(k => `<li>${G.got.includes(k) ? '✔' : '✘'} <b>${EVENTS[k][0]}</b>: ${L([EVENTS[k][1], EVENTS[k][2]])}</li>`).join('')}</ul>`; }
  return `<p><b>${t('pairsList')}</b></p><ul class='rev'>${PAIRS.map(p => `<li><b>${L(p[0])}</b>: ${L(p[1])}</li>`).join('')}</ul>`;
}
function endGame(){
  if (!game || !game.alive) return;
  const G = game, g = st.gameOn;
  if (G.id === 'match') G.score = Math.max(300, 1200 - G.misses*75);
  stopGame();
  st.gamesDone = st.gamesDone || []; const first = !st.gamesDone[g]; st.gamesDone[g] = true;
  const goldEarned = Math.round(G.score/3);
  if (first) st.gold = (st.gold || 0) + goldEarned;
  save(); renderHeader();
  const gm = document.getElementById('gmain'), sk = document.getElementById('gskip'); if (sk) sk.remove(); if (!gm) return;
  gm.innerHTML = `<div class='panel'><h3>🎮 ${t('results')}</h3><p class='gscore'>${t('score')}: ${G.score}</p><p>${pxText('🪙')} +${first ? goldEarned : 0} ${t('gold')} ${first ? '' : `<small>(${t('replayNote')})</small>`}</p>${reviewHTML(G)}<div class='actions'><button type='button' class='btn' data-act='gcont'>${g === GAMES.length - 1 && !st.gameRet ? (st.bossDone ? t('toFinal') : t('toBoss')) : t('nextStation')}</button></div></div>`;
  if (G.score > 0) confetti(document.body, true);
  gm.scrollIntoView({block:'start', behavior: reduceMotion() ? 'auto' : 'smooth'});
}
function exitGame(){
  const g = st.gameOn; stopGame();
  st.gamesDone = st.gamesDone || []; st.gamesDone[g] = true; st.gameOn = null;
  if (st.gameRet){ st.i = st.gameRet.i; st.step = st.gameRet.step; } else { st.i = GAME_AFTER[g] + 1; st.step = 0; if (g === GAMES.length - 1 && !st.bossDone) st.boss = true; }
  st.gameRet = null; q = null; bt = null; render(true); note(t('saved'));

    ['C5',1],['C5',1],['D5',1],['E5',1], ['C5',2],['B4',2],

    ['B4',1],['G4',1],['A4',1],['B4',1], ['C5',2],['C5',2],
    ['A4',1],['B4',1],['A4',1],['G4',1], ['A4',1],['B4',1],['C5',2],

  }
  function fife(freq, t, dur){
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();

  }
  function bass(freq, t){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = freq; o.connect(g); g.connect(master); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.start(t); o.stop(t + 0.4); }

const SFX = (() => {
  let ctx = null, out = null;
  function ready(){
    if (st.sfx === false) return false;
    if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false; ctx = new AC(); out = ctx.createGain(); out.gain.value = 0.5; out.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }
  function tone(type, f1, f2, t, dur, vol){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.setValueAtTime(vol, t + dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.03);
  }
  function say(text, pitch, rate, delay){
    if (!('speechSynthesis' in window) || speakingBtn) return;
    setTimeout(() => { try { if (speakingBtn) return; const u = new SpeechSynthesisUtterance(text); u.lang = st.lang === 'es' ? 'es-US' : 'en-US'; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(st.lang)); if (v) u.voice = v; u.pitch = pitch; u.rate = rate; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e) {} }, delay);
  }
  function fanfare(m){
    m = m || 1; const t = ctx.currentTime + 0.02;
    [[523.25,0],[659.25,.08],[783.99,.16],[1046.5,.24]].forEach(([f,d],i) => tone('square', f*m, 0, t + d, i === 3 ? 0.4 : 0.09, 0.13));
    tone('triangle', 261.63, 0, t + .24, .4, 0.3); tone('square', 1318.5, 0, t + .34, .25, 0.06);
  }
  function crowdBoo(){
    const t = ctx.currentTime + 0.02, dur = 1.5;
    const g = ctx.createGain(), f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter();
    f1.type = 'bandpass'; f1.frequency.value = 330; f1.Q.value = 3; f2.type = 'bandpass'; f2.frequency.value = 820; f2.Q.value = 5;
    f1.connect(g); f2.connect(g); g.connect(out);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.4, t + 0.18); g.gain.setValueAtTime(1.4, t + dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    for (let k = 0; k < 7; k++){
      const o = ctx.createOscillator(), og = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      const base = 100 + k*11 + Math.random()*8; o.type = 'sawtooth';
      o.frequency.setValueAtTime(base*1.12, t); o.frequency.exponentialRampToValueAtTime(base*0.82, t + dur);
      lfo.frequency.value = 4 + Math.random()*3; lg.gain.value = 3; lfo.connect(lg); lg.connect(o.frequency);
      og.gain.value = 0.11; o.connect(og); og.connect(f1); og.connect(f2);
      o.start(t + Math.random()*0.08); o.stop(t + dur + 0.05); lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    [[392,0],[370,.2],[349,.4]].forEach(([f,d]) => tone('square', f, 0, t + d, .17, 0.05)); tone('square', 330, 230, t + .6, .55, 0.05);
  }
  return {
    answer(ok, streak){
      if (!ready()) return;
      if (ok){ fanfare(1 + Math.min(streak || 0, 8)*0.06); say(st.lang === 'es' ? '¡Hurra!' : 'Huzzah!', 1.35, 1.05, 280); }
      else if (st.sfx === 'gentle'){ const t0 = ctx.currentTime + 0.02; tone('triangle', 392, 0, t0, .14, 0.2); tone('triangle', 330, 0, t0 + .16, .28, 0.18); }
      else { crowdBoo(); say(st.lang === 'es' ? '¡Buuu!' : 'Boo!', 0.6, 0.55, 120); }
    },
    ding(){ if (!ready()) return; const t = ctx.currentTime + 0.01; tone('square', 987.8, 0, t, .07, 0.1); tone('square', 1318.5, 0, t + .07, .15, 0.1); },
    buzz(){ if (!ready()) return; const t = ctx.currentTime + 0.01; tone('square', 196, 110, t, .3, 0.09); }
  };
})();

let speakRun = 0;
function stopSpeech(){
  speakRun++;
  MUSIC.duck(false);
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e) {}
  if (speakingBtn){ speakingBtn.classList.remove("on"); speakingBtn.textContent = t("readAloud"); speakingBtn = null; }

function speechChunks(text){
  const clean = String(text).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, " ").replace(/\s+/g, " ").trim();
  const sentences = clean.match(/[^.!?¿¡]+[.!?]*[”»"]?\s*/g) || [clean];
  const out = [];
  sentences.forEach(s => { s = s.trim(); if (!s) return; while (s.length > 200){ let cut = s.lastIndexOf(", ", 200); if (cut < 60) cut = s.lastIndexOf(" ", 200); if (cut < 1) cut = 200; out.push(s.slice(0, cut + 1)); s = s.slice(cut + 1).trim(); } if (s) out.push(s); });
  return out;
}
function pickVoice(){
  try {
    const want = st.lang === "es" ? "es" : "en", vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(want));
    return vs.find(v => v.localService && /us|419|mx/i.test(v.lang)) || vs.find(v => v.localService) || vs.find(v => /us|419|mx/i.test(v.lang)) || vs[0] || null;
  } catch(e) { return null; }
}
function speechMsg(){
  let el = document.getElementById("speechmsg");
  if (!el){ el = document.createElement("div"); el.id = "speechmsg"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = t("speechFail"); el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = "none"; }, 6000);
}
function speakText(text, btn){
  if (!("speechSynthesis" in window)){ speechMsg(); return; }
  stopSpeech();
  st.readCount = (st.readCount || 0) + 1; save();
  const run = ++speakRun, parts = speechChunks(text);
  if (!parts.length) return;
  let i = 0, anyStarted = false;
  if (btn){ speakingBtn = btn; btn.classList.add("on"); btn.textContent = t("stop"); }
  MUSIC.duck(true);
  const finish = () => { if (run !== speakRun) return; MUSIC.duck(false); if (btn && speakingBtn === btn){ btn.classList.remove("on"); btn.textContent = t("readAloud"); speakingBtn = null; } };
  const next = () => {
    if (run !== speakRun) return;
    if (i >= parts.length) return finish();
    const u = new SpeechSynthesisUtterance(parts[i++]);
    const v = pickVoice(); u.lang = st.lang === "es" ? "es-US" : "en-US"; if (v){ try { u.voice = v; u.lang = v.lang; } catch(e) {} }
    u.rate = 0.92;
    u.onstart = () => { anyStarted = true; };
    u.onend = () => next();
    u.onerror = e => { if (run !== speakRun || e.error === "interrupted" || e.error === "canceled") return; if (!anyStarted){ speechMsg(); return finish(); } next(); };
    try { speechSynthesis.speak(u); } catch(e) { speechMsg(); finish(); }
  };
  setTimeout(() => { if (run !== speakRun) return; try { if (speechSynthesis.paused) speechSynthesis.resume(); } catch(e) {} next(); }, 150);
  setTimeout(() => { if (run === speakRun && !anyStarted && !speechSynthesis.speaking){ speechMsg(); finish(); } }, 4000);
}
try { if ("speechSynthesis" in window){ speechSynthesis.getVoices(); } } catch(e) {}

/* ---------- Glossary ---------- */
let glossKey = null;
function openGloss(k){
  const g = GLOSS[k]; if (!g) return; glossKey = k;
  const [term, def] = g[st.lang];
  document.getElementById("gt").textContent = term;
  document.getElementById("gd").textContent = def;
  document.getElementById("gsay").textContent = t("listen");
  document.getElementById("gclose").textContent = t("close");
  document.getElementById("gloss").classList.add("show");
  document.getElementById("gclose").focus();
}
function closeGloss(){ document.getElementById("gloss").classList.remove("show"); glossKey = null; }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "term"){ openGloss(b.dataset.term); return; }
  if (a === "closegloss"){ closeGloss(); return; }
  if (a === "saygloss"){ const g = GLOSS[glossKey]; if (g) speakText(g[st.lang][0] + ". " + g[st.lang][1], null); return; }
  if (a === "say"){
    if (speakingBtn === b){ stopSpeech(); return; }
    const el = document.getElementById(b.dataset.target);
    if (el) speakText(el.innerText.replace(/[▲▼⭐☆✓]/g," "), b);
    return;
  }
  if (a === "logbook"){ openLog(); return; }
  if (a === "closelog"){ closeLog(); return; }
  if (a === "vote"){ st.vote = b.dataset.v; save(); SFX.ding(); render(); return; }
  if (a === "bet"){ if (wagerEligible()){ st.gold -= 100; bt.wager = true; bt.wagerAsked = true; SFX.ding(); save(); render(); } return; }
  if (a === "nobet"){ if (bt) bt.wagerAsked = true; render(); return; }
  if (a === "duel"){ st.duel = true; q = null; bt = null; render(true); return; }
  if (a === "dstart"){ dStart(); return; }
  if (a === "dready"){ dQuestion(); return; }
  if (a === "dpick"){ dAnswer(+b.dataset.i); return; }
  if (a === "dexit"){ stopGame(); st.duel = false; render(true); return; }
  if (a === "tutnext"){ const k = +b.dataset.k + 1; if (k < TUT.length) showTut(k); else endTut(); return; }
  if (a === "tutskip"){ endTut(); return; }
  if (a === "copycode"){ copyCode(); return; }
  if (a === "checkcodes"){ runChecker(); return; }
  if (a === "leaveteacher"){ try { history.replaceState(null, "", location.pathname + location.search); } catch(e) { location.hash = ""; } render(true); return; }
  if (a === "sfx"){ st.sfx = st.sfx === false ? true : st.sfx === "gentle" ? false : "gentle"; save(); renderHeader(); if (st.sfx !== false) SFX.ding(); note(st.sfx === false ? t("sfxOffNote") : st.sfx === "gentle" ? t("sfxGentleNote") : t("sfxFullNote")); return; }
  if (a === "capt"){ st.capt = +b.dataset.c; save(); document.querySelectorAll("[data-act=capt]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.c === st.capt))); renderHeader(); return; }
  if (a === "wear"){ const it = SHOP.find(x => x.k === b.dataset.k); if (it && inv2().owned.includes(it.k)){ const E = equip(); E[it.slot] = E[it.slot] === it.k ? null : it.k; save(); refreshShop(); } return; }
  if (a === "hard"){ st.hard = true; q = null; bt = null; render(true); return; }
  if (a === "hstart"){ hStart(); return; }
  if (a === "hexit"){ stopGame(); st.hard = false; render(true); return; }
  if (a === "hpick"){ hAnswer(+b.dataset.i); return; }
  if (a === "music"){ st.music = !st.music; if (st.music) MUSIC.start(); else MUSIC.stop(); save(); renderHeader(); return; }
  if (a === "simple"){ st.simple = !st.simple; render(); return; }
  if (a === "lang"){ st.lang = st.lang === "en" ? "es" : "en"; closeGloss(); render(); return; }
  if (a === "reset"){
    if (b.classList.contains("warn")){
      clearTimeout(confirmTimer);
      const keep = {simple:st.simple, lang:st.lang, music:st.music, sfx:st.sfx, capt:st.capt, cname:st.cname, sname:st.sname, best:st.best, ach:st.ach, tutDone:st.tutDone};
      st = Object.assign({i:-1, step:0, done:[], stars:{}, claim:null, started:false, gold:0, gamesDone:[], gameOn:null, gameRet:null, inv:{hint:0, lucky:0, sails:[], owned:[]}, equip:{}, sail:'white', missed:[], boss:false, bossDone:false, hard:false}, keep);
      q = null; bt = null; render(true); return;
    }
    b.classList.add("warn"); b.textContent = t("confirmOver");
    confirmTimer = setTimeout(() => { b.classList.remove("warn"); b.textContent = t("startOver"); }, 4000);
    return;
  }
  if (a === "begin"){
    st.started = true;
    if (st.i < 0){ st.i = Math.min(maxUnlocked(), S.length); st.step = 0; }
    q = null; render(true); return;
  }
  if (a === "goto"){ const i = +b.dataset.i; if (i <= maxUnlocked()){ st.i = i; st.step = 0; st.started = true; st.gameOn = null; st.gameRet = null; st.boss = false; st.hard = false; st.duel = false; q = null; bt = null; render(true); } return; }
  if (a === "gamepin"){ const g = +b.dataset.g; if (st.done[GAME_AFTER[g]]){ const gd = st.gamesDone || []; st.gameRet = gd[g] ? (st.gameOn != null ? st.gameRet : {i:st.i, step:st.step}) : null; st.gameOn = g; st.boss = false; q = null; bt = null; render(true); } return; }
  if (a === "gstart"){ startGame(); return; }
  if (a === "gcont" || a === "skipgame"){ exitGame(); return; }
  if (a === "mflip"){ mFlip(+b.dataset.i); return; }
  if (a === "dmove"){ dMove(+b.dataset.d); return; }
  if (a === "ddrop"){ dDrop(); return; }
  if (a === "dcol"){ if (game && game.cur){ const c = +b.dataset.c; if (game.cur.row <= game.rows-1-game.stacks[c]){ game.cur.col = c; dPlace(); } } return; }
  if (a === "step"){ st.step = +b.dataset.to; q = null; render(true); return; }
  if (a === "pick"){ q.choice = +b.dataset.i; render(); const el = document.querySelector(`[data-act="pick"][data-i="${b.dataset.i}"]`); if (el) el.focus(); return; }
  if (a === "mv"){
    const p = +b.dataset.pos, d = +b.dataset.d, np = p + d;
    [q.order[p], q.order[np]] = [q.order[np], q.order[p]]; q.rows = null; render();
    const el = document.querySelector(`[data-act="mv"][data-pos="${np}"][data-d="${d}"]`) || document.querySelector(`[data-act="mv"][data-pos="${np}"]:not([disabled])`);
    if (el) el.focus(); return;
  }
  if (a === "submit" && (st.boss || st.step === 2)){ battleSubmit(); return; }
  if (a === "submit"){
    const s = S[st.i]; const qd = st.step === 1 ? s.source.q : s.check; const key = (st.step === 1 ? "s" : "c") + st.i;
    submit(qd, key); SFX.answer(q.solved); render();
    const fb = document.querySelector(".fb"); if (fb) fb.scrollIntoView({block:"nearest", behavior:"smooth"});
    document.getElementById("live").textContent = fb ? fb.innerText : "";
    return;
  }
  if (a === "next" && (st.boss || st.step === 2) && bt){
    if (bt.won && st.boss){ if (!bt.hitTaken) st.ironHull = true; st.boss = false; st.bossDone = true; st.i = S.length; st.step = 0; bt = null; q = null; render(true); confetti(document.body, true); return; }
    if (bt.won){ st.done[st.i] = true; bt = null; q = null; st.step = 3; render(true); confetti(document.body, true); note(t('saved')); return; }
    const idx = bt.queue.shift(); if (q && q.revealed) bt.queue.push(idx); bt.tStart = performance.now();
    q = null; bt.shownE = bt.enemy; bt.shownP = bt.player; bt.shownFire = bt.fire; render();
    const ar = document.getElementById("arena"); if (ar) ar.scrollIntoView({block:"start", behavior: reduceMotion() ? "auto" : "smooth"});
    return;
  }
  if (a === "next"){
    q = null; bt = null;
    st.step++; render(true); return;
  }
  if (a === "shop"){ openShop(); return; }
  if (a === "closeshop"){ closeShop(); return; }
  if (a === "buy"){ const g0 = st.gold || 0; buyItem(b.dataset.k); if ((st.gold || 0) < g0){ st.boughtAny = true; save(); checkAch(); } return; }
  if (a === "equip"){ st.sail = b.dataset.k; save(); ensureSail(); refreshShop(); return; }
  if (a === "usehint"){ useHint(); return; }
  if (a === "gofinal"){ if (maxUnlocked() >= S.length){ st.i = S.length; st.step = 0; st.gameOn = null; st.hard = false; st.duel = false; if (!st.bossDone) st.boss = true; q = null; bt = null; render(true); } return; }
  if (a === "nextstation"){
    const g = GAME_AFTER.indexOf(st.i);
    if (g >= 0 && !(st.gamesDone || [])[g]){ st.gameOn = g; st.gameRet = null; q = null; bt = null; render(true); return; }
    st.i++; st.step = 0; q = null; bt = null; render(true); return;
  }
  if (a === "claim"){ st.claim = b.dataset.c; render(); return; }
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-act='match']"); if (!s) return;
  q.match[+s.dataset.i] = s.value; q.rows = null;
  const id = s.id; render(); const el = document.getElementById(id); if (el) el.focus();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeGloss(); });
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
if (st.music) document.addEventListener("pointerdown", () => { if (st.music && !MUSIC.on) MUSIC.start(); }, {once:true});

render();
</script>
